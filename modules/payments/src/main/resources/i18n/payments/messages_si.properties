error.DENOMINATION_UNKNOWN.title=Unknown denomination
error.DENOMINATION_UNKNOWN.detail={value} is not one of the tenant's notes and coins.
error.DRAWER_NOT_YOURS.title=Not your drawer
error.DRAWER_NOT_YOURS.detail=Drawer session {sessionId} is operated by the cashier who opened it or a manager.
error.DRAWER_OF_ANOTHER_REGISTER.title=Drawer of another register
error.DRAWER_OF_ANOTHER_REGISTER.detail=Drawer session {sessionId} belongs to another register than {registerId}.
error.REFUND_EXCEEDS_PAYMENT.title=Refund exceeds the payment
error.REFUND_EXCEEDS_PAYMENT.detail=At most {remaining} can still be refunded.
error.DRAWER_NOT_OPEN.title=No open drawer
error.DRAWER_NOT_OPEN.detail=Register {registerId} has no open drawer.
error.DRAWER_ALREADY_OPEN.title=Drawer already open
error.DRAWER_ALREADY_OPEN.detail=Register {registerId} already has a drawer that is not reconciled.
error.DRAWER_STATE_INVALID.title=Drawer state invalid
error.DRAWER_STATE_INVALID.detail=Not possible while the drawer is {status}.
