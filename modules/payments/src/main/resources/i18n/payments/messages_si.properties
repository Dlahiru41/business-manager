# Payments module error titles and details.
error.PAYMENT_NOT_FOUND.title=Payment not found
error.PAYMENT_NOT_FOUND.detail=Payment {paymentId} does not exist.
error.DRAWER_SESSION_NOT_FOUND.title=Drawer session not found
error.DRAWER_SESSION_NOT_FOUND.detail=Drawer session {sessionId} does not exist.
error.UNKNOWN_CUSTOMER.title=Unknown customer
error.UNKNOWN_CUSTOMER.detail=Customer {customerId} does not exist or is inactive.
error.UNKNOWN_REGISTER.title=Unknown register
error.UNKNOWN_REGISTER.detail=Register {registerId} does not exist or is inactive.
error.CARD_DATA_NOT_ALLOWED.title=Card data not allowed
