# Local development: compose stack from deploy/local, readable plain-text logs, every trace sampled.
spring:
  datasource:
    password: ${BMP_APP_PASSWORD:bmp_app}
bmp:
  iam:
    keycloak:
      client-secret: ${BMP_KEYCLOAK_ADMIN_CLIENT_SECRET:local-dev-admin-secret}
  persistence:
    migrator:
      password: ${BMP_MIGRATOR_PASSWORD:bmp_migrator}
    platform-admin:
      password: ${BMP_PLATFORM_ADMIN_PASSWORD:bmp_platform_admin}
management:
  tracing:
    sampling:
      probability: 1.0
  # Metrics go to the local otel-lgtm stack too, for deploy/local/grafana/dashboards/bmp-overview.json.
  otlp:
    metrics:
      export:
        enabled: true
        url: ${BMP_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 15s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always
