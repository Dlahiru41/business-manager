org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

group=com.bmp
version=0.1.0-SNAPSHOT

# Maven Central answers bursts of downloads (fresh CI runners) with HTTP 429; Gradle retries 429 as transient, but by
# default only 3 times from a 1 s back-off. Six attempts doubling from 2 s ride out the limit (worst case about a minute).
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
