              example:
                id: 0193f000-0000-7000-8000-000000000201
                number: GRN-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: DRAFT
                receivedAt: '2026-11-23T09:00:00Z'
                total:
                  amount: '12750.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000211
                  variantId: 0193c000-0000-7000-8000-000000000202
                  packagingUnitId: 0193c000-0000-7000-8000-000000000302
                  qty: '10'
                  qtyBase: '300'
                  stockState: DEFAULT
                  unitCost: '1275.00'
                  unitCostBase: '42.500000'
                  lineTotal:
                    amount: '12750.00'
                    currency: LKR
                invoiced: false
                version: 0
                createdAt: '2026-11-23T09:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '412':
