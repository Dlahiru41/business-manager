openapi: 3.1.0
info:
  title: BMP Procurement API
  version: 1.0.0
  description: 'Purchase orders, goods receipts and supplier invoices (phase 02, rules PRO-01..PRO-07).


    Orders and receipts are counted in packaging units the variant can be bought in (PRO-01); a receipt line also holds

    its quantity and cost per base unit (`qtyBase = qty × qtyInBase`, `unitCostBase = unitCost / qtyInBase`, PRO-03).

    Posting a receipt publishes `GoodsReceived`, which inventory books as stock (PRO-04); posted receipts never change,
    a

    correction is a return receipt with negative lines and needs `procurement:correct` (PRO-02). Supplier invoices match

    posted receipts and carry the price variance (PRO-05). Numbers come from per-tenant sequences: `PO-000001`,

    `GRN-000001` (PRO-07).

    '
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: PurchaseOrders
  description: Orders to suppliers (PRO-01, PRO-06).
- name: GoodsReceipts
  description: Deliveries received, with or without an order (PRO-02..PRO-04).
- name: SupplierInvoices
  description: Supplier invoices matched to receipts (PRO-05).
paths:
  /api/v1/purchase-orders:
    get:
      tags:
      - PurchaseOrders
      operationId: listPurchaseOrders
      summary: Purchase orders, newest first
      x-permission: procurement:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PurchaseOrderStatus'
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPage'
              example:
                items:
                - id: 0193f000-0000-7000-8000-000000000101
                  number: PO-000001
                  supplierId: 0193d000-0000-7000-8000-000000000101
                  locationId: 0193b000-0000-7000-8000-000000000401
                  status: SENT
                  expectedOn: '2026-11-25'
                  total:
                    amount: '138000.00'
                    currency: LKR
                  lines:
                  - id: 0193f000-0000-7000-8000-000000000111
                    variantId: 0193c000-0000-7000-8000-000000000301
                    packagingUnitId: 0193c000-0000-7000-8000-000000000321
                    qty: '10'
                    unitCost: '13800.00'
                    lineTotal:
                      amount: '138000.00'
                      currency: LKR
                    receivedQty: '0'
                  version: 1
                  createdAt: '2026-11-23T08:30:00Z'
                  sentAt: '2026-11-23T08:35:00Z'
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - PurchaseOrders
      operationId: createPurchaseOrder
      summary: Draft a purchase order (PRO-01)
      x-permission: procurement:order
      x-error-codes:
      - VALIDATION_FAILED
      - UNKNOWN_SUPPLIER
      - UNKNOWN_LOCATION
      - UNKNOWN_VARIANT
      - UNKNOWN_PACKAGING_UNIT
      - UNIT_NOT_PURCHASABLE
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
            example:
              supplierId: 0193d000-0000-7000-8000-000000000101
              locationId: 0193b000-0000-7000-8000-000000000401
              expectedOn: '2026-11-25'
              lines:
              - variantId: 0193c000-0000-7000-8000-000000000301
                packagingUnitId: 0193c000-0000-7000-8000-000000000321
                qty: '10'
                unitCost: '13800.00'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              example:
                id: 0193f000-0000-7000-8000-000000000101
                number: PO-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: DRAFT
                expectedOn: '2026-11-25'
                total:
                  amount: '138000.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000111
                  variantId: 0193c000-0000-7000-8000-000000000301
                  packagingUnitId: 0193c000-0000-7000-8000-000000000321
                  qty: '10'
                  unitCost: '13800.00'
                  lineTotal:
                    amount: '138000.00'
                    currency: LKR
                  receivedQty: '0'
                version: 0
                createdAt: '2026-11-23T08:30:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/purchase-orders/{orderId}:
    get:
      tags:
      - PurchaseOrders
      operationId: getPurchaseOrder
      summary: Get a purchase order
      x-permission: procurement:read
      x-error-codes:
      - PURCHASE_ORDER_NOT_FOUND
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              examples:
                default:
                  $ref: '#/components/examples/PurchaseOrder'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
    patch:
      tags:
      - PurchaseOrders
      operationId: updatePurchaseOrder
      summary: Change a draft purchase order
      x-permission: procurement:order
      x-error-codes:
      - VALIDATION_FAILED
      - PRECONDITION_REQUIRED
      - VERSION_CONFLICT
      - PURCHASE_ORDER_NOT_FOUND
      - PURCHASE_ORDER_STATE_INVALID
      - UNKNOWN_VARIANT
      - UNKNOWN_PACKAGING_UNIT
      - UNIT_NOT_PURCHASABLE
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePurchaseOrderRequest'
            example:
              expectedOn: '2026-11-26'
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              example:
                id: 0193f000-0000-7000-8000-000000000101
                number: PO-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: DRAFT
                expectedOn: '2026-11-25'
                total:
                  amount: '138000.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000111
                  variantId: 0193c000-0000-7000-8000-000000000301
                  packagingUnitId: 0193c000-0000-7000-8000-000000000321
                  qty: '10'
                  unitCost: '13800.00'
                  lineTotal:
                    amount: '138000.00'
                    currency: LKR
                  receivedQty: '0'
                version: 0
                createdAt: '2026-11-23T08:30:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '412':
          $ref: ./common.yaml#/components/responses/PreconditionFailed
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
        '428':
          $ref: ./common.yaml#/components/responses/PreconditionRequired
  /api/v1/purchase-orders/{orderId}/send:
    post:
      tags:
      - PurchaseOrders
      operationId: sendPurchaseOrder
      summary: Mark an order as sent to the supplier
      x-permission: procurement:order
      x-error-codes:
      - PURCHASE_ORDER_NOT_FOUND
      - PURCHASE_ORDER_STATE_INVALID
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              example:
                id: 0193f000-0000-7000-8000-000000000101
                number: PO-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: SENT
                expectedOn: '2026-11-25'
                total:
                  amount: '138000.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000111
                  variantId: 0193c000-0000-7000-8000-000000000301
                  packagingUnitId: 0193c000-0000-7000-8000-000000000321
                  qty: '10'
                  unitCost: '13800.00'
                  lineTotal:
                    amount: '138000.00'
                    currency: LKR
                  receivedQty: '0'
                version: 1
                createdAt: '2026-11-23T08:30:00Z'
                sentAt: '2026-11-23T08:35:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
  /api/v1/purchase-orders/{orderId}/cancel:
    post:
      tags:
      - PurchaseOrders
      operationId: cancelPurchaseOrder
      summary: Cancel an order that nothing was received for
      x-permission: procurement:order
      x-error-codes:
      - PURCHASE_ORDER_NOT_FOUND
      - PURCHASE_ORDER_STATE_INVALID
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              example:
                id: 0193f000-0000-7000-8000-000000000101
                number: PO-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: CANCELLED
                expectedOn: '2026-11-25'
                total:
                  amount: '138000.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000111
                  variantId: 0193c000-0000-7000-8000-000000000301
                  packagingUnitId: 0193c000-0000-7000-8000-000000000321
                  qty: '10'
                  unitCost: '13800.00'
                  lineTotal:
                    amount: '138000.00'
                    currency: LKR
                  receivedQty: '0'
                version: 1
                createdAt: '2026-11-23T08:30:00Z'
                sentAt: '2026-11-23T08:35:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
  /api/v1/purchase-orders:from-reorder-list:
    post:
      tags:
      - PurchaseOrders
      operationId: createPurchaseOrdersFromReorderList
      summary: Draft orders for everything below its reorder level (PRO-06)
      description: One draft order per preferred supplier and location, for each variant's reorder quantity in its first
        buyable packaging unit (rounded up), at the last received cost.
      x-permission: procurement:order
      x-error-codes:
      - VALIDATION_FAILED
      - UNKNOWN_LOCATION
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromReorderListRequest'
            example:
              locationId: 0193b000-0000-7000-8000-000000000401
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FromReorderListResult'
              example:
                orders:
                - id: 0193f000-0000-7000-8000-000000000101
                  number: PO-000001
                  supplierId: 0193d000-0000-7000-8000-000000000101
                  locationId: 0193b000-0000-7000-8000-000000000401
                  status: DRAFT
                  expectedOn: '2026-11-25'
                  total:
                    amount: '138000.00'
                    currency: LKR
                  lines:
                  - id: 0193f000-0000-7000-8000-000000000111
                    variantId: 0193c000-0000-7000-8000-000000000301
                    packagingUnitId: 0193c000-0000-7000-8000-000000000321
                    qty: '10'
                    unitCost: '13800.00'
                    lineTotal:
                      amount: '138000.00'
                      currency: LKR
                    receivedQty: '0'
                  version: 0
                  createdAt: '2026-11-23T08:30:00Z'
                skippedVariantIds: []
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/goods-receipts:
    get:
      tags:
      - GoodsReceipts
      operationId: listGoodsReceipts
      summary: Goods receipts, newest first
      x-permission: procurement:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GoodsReceiptStatus'
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: purchaseOrderId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: invoiced
        in: query
        required: false
        schema:
          type: boolean
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceiptPage'
              example:
                items:
                - id: 0193f000-0000-7000-8000-000000000201
                  number: GRN-000001
                  supplierId: 0193d000-0000-7000-8000-000000000101
                  locationId: 0193b000-0000-7000-8000-000000000401
                  status: POSTED
                  receivedAt: '2026-11-23T09:00:00Z'
                  postedAt: '2026-11-23T09:05:00Z'
                  total:
                    amount: '12750.00'
                    currency: LKR
                  lines:
                  - id: 0193f000-0000-7000-8000-000000000211
                    variantId: 0193c000-0000-7000-8000-000000000202
                    packagingUnitId: 0193c000-0000-7000-8000-000000000302
                    qty: '10'
                    qtyBase: '300'
                    stockState: DEFAULT
                    unitCost: '1275.00'
                    unitCostBase: '42.500000'
                    lineTotal:
                      amount: '12750.00'
                      currency: LKR
                  invoiced: false
                  version: 2
                  createdAt: '2026-11-23T09:00:00Z'
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - GoodsReceipts
      operationId: createGoodsReceipt
      summary: Record a delivery or a return (PRO-02, PRO-03)
      description: A draft; `post` books it. Negative lines (a return) need `procurement:correct` and `correctsReceiptId`,
        and send back at most what that receipt brought in less earlier returns.
      x-permission: procurement:receive
      x-error-codes:
      - VALIDATION_FAILED
      - UNKNOWN_SUPPLIER
      - UNKNOWN_LOCATION
      - PURCHASE_ORDER_MISMATCH
      - MIXED_LINE_SIGNS
      - CORRECTION_PERMISSION_REQUIRED
      - CORRECTION_TARGET_INVALID
      - EXPIRY_REQUIRED
      - PURCHASE_ORDER_STATE_INVALID
      - UNKNOWN_VARIANT
      - UNKNOWN_PACKAGING_UNIT
      - UNIT_NOT_PURCHASABLE
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoodsReceiptRequest'
            example:
              supplierId: 0193d000-0000-7000-8000-000000000101
              locationId: 0193b000-0000-7000-8000-000000000401
              lines:
              - variantId: 0193c000-0000-7000-8000-000000000202
                packagingUnitId: 0193c000-0000-7000-8000-000000000302
                qty: '10'
                unitCost: '1275.00'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
              example:
                id: 0193f000-0000-7000-8000-000000000201
                number: GRN-000001
                supplierId: 0193d000-0000-7000-8000-000000000101
                locationId: 0193b000-0000-7000-8000-000000000401
                status: DRAFT
                receivedAt: '2026-11-23T09:00:00Z'
                total:
                  amount: '12750.00'
                  currency: LKR
                lines:
                - id: 0193f000-0000-7000-8000-000000000211
                  variantId: 0193c000-0000-7000-8000-000000000202
                  packagingUnitId: 0193c000-0000-7000-8000-000000000302
                  qty: '10'
                  qtyBase: '300'
                  stockState: DEFAULT
                  unitCost: '1275.00'
                  unitCostBase: '42.500000'
                  lineTotal:
                    amount: '12750.00'
                    currency: LKR
                invoiced: false
                version: 0
                createdAt: '2026-11-23T09:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/goods-receipts/{receiptId}:
