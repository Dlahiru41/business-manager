components:
  securitySchemes:
    bearerAuth:
      $ref: ./common.yaml#/components/securitySchemes/bearerAuth
  schemas:
    PurchaseOrderStatus:
      type: string
      enum:
      - DRAFT
      - SENT
      - PARTIALLY_RECEIVED
      - RECEIVED
      - CANCELLED
    PurchaseOrderLine:
      type: object
      required:
      - id
      - variantId
      - packagingUnitId
      - qty
      - unitCost
      - lineTotal
      - receivedQty
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        unitCost:
          $ref: '#/components/schemas/UnitCost'
          description: Per packaging unit.
        lineTotal:
          $ref: ./common.yaml#/components/schemas/Money
        receivedQty:
          $ref: '#/components/schemas/SignedQuantity'
          description: Posted so far, in the line's packaging unit.
    PurchaseOrder:
      type: object
      required:
      - id
      - number
      - supplierId
      - locationId
      - status
      - total
      - lines
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: PO-000001
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        expectedOn:
          type: string
          format: date
        notes:
          type: string
        total:
          $ref: ./common.yaml#/components/schemas/Money
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
    PurchaseOrderPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    PurchaseOrderLineInput:
      type: object
      additionalProperties: false
      required:
      - variantId
      - packagingUnitId
      - qty
      - unitCost
      properties:
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        unitCost:
          $ref: '#/components/schemas/UnitCost'
          description: Per packaging unit.
    CreatePurchaseOrderRequest:
      type: object
      additionalProperties: false
      required:
      - supplierId
      - locationId
      - lines
      properties:
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        expectedOn:
          type: string
          format: date
        notes:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PurchaseOrderLineInput'
    UpdatePurchaseOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        expectedOn:
          type: string
          format: date
        notes:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          description: Replaces all lines (DRAFT orders only).
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PurchaseOrderLineInput'
    FromReorderListRequest:
      type: object
      additionalProperties: false
      properties:
        locationId:
          type: string
          format: uuid
          description: All locations when absent.
    FromReorderListResult:
      type: object
      required:
      - orders
      - skippedVariantIds
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        skippedVariantIds:
          type: array
          description: Below their reorder level but without a preferred supplier or buyable unit.
          items:
            type: string
            format: uuid
    GoodsReceiptStatus:
      type: string
      enum:
      - DRAFT
      - POSTED
      - CANCELLED
    GoodsReceiptLine:
      type: object
      required:
      - id
      - variantId
      - packagingUnitId
      - qty
      - qtyBase
      - stockState
      - unitCost
      - unitCostBase
      - lineTotal
      properties:
        id:
          type: string
          format: uuid
        purchaseOrderLineId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/SignedQuantity'
        qtyBase:
          $ref: '#/components/schemas/SignedQuantity'
        stockState:
          type: string
        unitCost:
          $ref: '#/components/schemas/UnitCost'
        unitCostBase:
          $ref: '#/components/schemas/UnitCost'
        lineTotal:
          $ref: ./common.yaml#/components/schemas/Money
        batchCode:
          type: string
        expiresOn:
          type: string
          format: date
    GoodsReceipt:
      type: object
      required:
      - id
      - number
      - supplierId
      - locationId
      - status
      - receivedAt
      - total
      - lines
      - invoiced
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: GRN-000001
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        purchaseOrderId:
          type: string
          format: uuid
        correctsReceiptId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/GoodsReceiptStatus'
        receivedAt:
          type: string
          format: date-time
        notes:
          type: string
        postedAt:
          type: string
          format: date-time
        postedBy:
          type: string
          format: uuid
        total:
          $ref: ./common.yaml#/components/schemas/Money
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceiptLine'
        invoiced:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    GoodsReceiptPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceipt'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    GoodsReceiptLineInput:
      type: object
      additionalProperties: false
      required:
      - variantId
      - packagingUnitId
      - qty
      - unitCost
      properties:
        purchaseOrderLineId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/SignedQuantity'
          description: Negative on a return to the supplier (PRO-02).
        unitCost:
          $ref: '#/components/schemas/UnitCost'
          description: Per packaging unit.
        batchCode:
          type: string
          minLength: 1
          maxLength: 40
          description: Generated when the variant tracks batches and none is given (INV-14).
        expiresOn:
          type: string
          format: date
          description: Required when the variant tracks expiry (INV-14).
    CreateGoodsReceiptRequest:
      type: object
      additionalProperties: false
      required:
      - supplierId
      - locationId
      - lines
      properties:
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        purchaseOrderId:
          type: string
          format: uuid
        correctsReceiptId:
          type: string
          format: uuid
          description: The posted receipt a return corrects (negative lines).
        receivedAt:
          type: string
          format: date-time
        notes:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GoodsReceiptLineInput'
    UpdateGoodsReceiptRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        receivedAt:
          type: string
          format: date-time
        notes:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          description: Replaces all lines (DRAFT receipts only).
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GoodsReceiptLineInput'
    SupplierInvoiceStatus:
      type: string
      enum:
      - DRAFT
      - POSTED
    InvoiceMatch:
      type: object
      required:
      - receiptId
      - receiptNumber
      - receiptValue
      properties:
        receiptId:
          type: string
          format: uuid
        receiptNumber:
          type: string
        receiptValue:
          $ref: ./common.yaml#/components/schemas/Money
    SupplierInvoice:
      type: object
      required:
      - id
      - supplierId
      - supplierRef
      - invoiceDate
      - subtotal
      - tax
      - total
      - status
      - receipts
      - receiptValue
      - priceVariance
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        supplierRef:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        subtotal:
          $ref: ./common.yaml#/components/schemas/Money
        tax:
          $ref: ./common.yaml#/components/schemas/Money
        total:
          $ref: ./common.yaml#/components/schemas/Money
        status:
          $ref: '#/components/schemas/SupplierInvoiceStatus'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceMatch'
        receiptValue:
          $ref: ./common.yaml#/components/schemas/Money
        priceVariance:
          $ref: ./common.yaml#/components/schemas/Money
          description: subtotal − receipt value (PRO-05).
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
    SupplierInvoicePage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupplierInvoice'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    CreateSupplierInvoiceRequest:
      type: object
      additionalProperties: false
      required:
      - supplierId
      - supplierRef
      - invoiceDate
      - subtotal
      - receiptIds
      properties:
        supplierId:
          type: string
          format: uuid
        supplierRef:
          type: string
          minLength: 1
          maxLength: 60
          description: The supplier's invoice number; unique per supplier.
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: 'Default: invoice date + the supplier''s payment terms.'
        subtotal:
          $ref: '#/components/schemas/Amount'
          description: Before tax.
        tax:
          $ref: '#/components/schemas/Amount'
        receiptIds:
          type: array
          description: Posted receipts of the same supplier, not invoiced yet.
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
    Code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_\-]{0,29}$
    Status:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Quantity:
      type: string
      description: A positive decimal with up to 6 decimals.
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '10'
    SignedQuantity:
      type: string
      description: A decimal with up to 6 decimals; in > 0, out < 0 (INV-02).
      pattern: ^-?(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '-19565'
    UnitCost:
      type: string
      description: A non-negative cost per unit with up to 6 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,12})(\.[0-9]{1,6})?$
      example: '0.705341'
    Amount:
      type: string
      description: A non-negative money amount with up to 4 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      example: '13800.00'
  examples:
    PurchaseOrder:
      value:
        id: 0193f000-0000-7000-8000-000000000101
