      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - name: receiptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
