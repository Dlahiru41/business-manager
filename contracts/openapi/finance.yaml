      - days0To30
      - days31To60
      - days61To90
      - days90Plus
      properties:
        days0To30:
          $ref: ./common.yaml#/components/schemas/Money
        days31To60:
          $ref: ./common.yaml#/components/schemas/Money
        days61To90:
          $ref: ./common.yaml#/components/schemas/Money
        days90Plus:
          $ref: ./common.yaml#/components/schemas/Money
    AgingRow:
      type: object
      required:
      - partyId
      - balance
      - buckets
      - openItems
      properties:
        partyId:
          type: string
          format: uuid
        balance:
          $ref: ./common.yaml#/components/schemas/Money
        buckets:
          $ref: '#/components/schemas/AgingBuckets'
        oldestOpenDate:
          type: string
          format: date
        openItems:
          type: integer
          format: int32
    Aging:
      type: object
      required:
      - asOf
      - partyType
      - rows
      - totals
      - page
      properties:
        asOf:
          type: string
          format: date
        partyType:
          $ref: '#/components/schemas/PartyType'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AgingRow'
        totals:
          type: object
          required:
          - balance
          - buckets
          properties:
            balance:
              $ref: ./common.yaml#/components/schemas/Money
            buckets:
              $ref: '#/components/schemas/AgingBuckets'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    DocumentType:
      type: string
      enum:
      - BILL
      - COLLECTION
      - RETURN
      - VOID
      - REFUND
      - SUPPLIER_INVOICE
      - SUPPLIER_PAYMENT
      - EXPENSE
      - SUPPLIER_RETURN
    StatementEntry:
      type: object
      required:
      - date
      - documentType
      - documentId
      - debit
      - credit
      - balance
      properties:
        date:
          type: string
          format: date
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentId:
          type: string
          format: uuid
        debit:
          $ref: ./common.yaml#/components/schemas/Money
        credit:
          $ref: ./common.yaml#/components/schemas/Money
        balance:
          $ref: ./common.yaml#/components/schemas/Money
    OpenItem:
      type: object
      required:
      - id
      - documentType
      - documentId
      - documentDate
      - dueDate
      - amount
      - settled
      - open
      - daysOverdue
      properties:
        id:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentId:
          type: string
          format: uuid
        documentDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        amount:
          $ref: ./common.yaml#/components/schemas/Money
          description: Negative for a credit not yet applied.
        settled:
          $ref: ./common.yaml#/components/schemas/Money
        open:
          $ref: ./common.yaml#/components/schemas/Money
        daysOverdue:
          type: integer
          format: int32
    Statement:
      type: object
      required:
      - partyId
      - partyType
      - openingBalance
      - entries
      - closingBalance
      - openItems
      properties:
        partyId:
          type: string
          format: uuid
        partyType:
          $ref: '#/components/schemas/PartyType'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        openingBalance:
          $ref: ./common.yaml#/components/schemas/Money
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        closingBalance:
          $ref: ./common.yaml#/components/schemas/Money
        openItems:
          type: array
          items:
            $ref: '#/components/schemas/OpenItem'
    Allocation:
      type: object
      required:
      - documentId
      - amount
      properties:
        documentId:
          type: string
          format: uuid
        amount:
          $ref: ./common.yaml#/components/schemas/Money
    AllocationRequest:
      type: object
      additionalProperties: false
      required:
      - documentId
      - amount
      properties:
        documentId:
          type: string
          format: uuid
          description: A supplier invoice or expense.
        amount:
          $ref: '#/components/schemas/Amount'
    SupplierPaidFrom:
      type: string
      enum:
      - BANK
      - CASH_DRAWER
    SupplierPayment:
      type: object
      required:
      - id
      - supplierId
      - amount
      - paidFrom
      - paidAt
      - allocations
      - journalId
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        amount:
          $ref: ./common.yaml#/components/schemas/Money
        paidFrom:
          $ref: '#/components/schemas/SupplierPaidFrom'
        drawerSessionId:
          type: string
          format: uuid
        reference:
          type: string
        paidAt:
          type: string
          format: date-time
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        journalId:
          type: string
          format: uuid
    SupplierPaymentRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - supplierId
      - amount
      - paidFrom
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the caller.
        supplierId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        paidFrom:
          $ref: '#/components/schemas/SupplierPaidFrom'
        drawerSessionId:
          type: string
          format: uuid
          description: Needed for CASH_DRAWER.
        reference:
          type: string
          minLength: 1
          maxLength: 60
        paidAt:
          type: string
          format: date-time
          description: Default now.
        allocations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AllocationRequest'
    CashDrop:
      type: object
      required:
      - id
      - drawerSessionId
      - registerId
      - amount
      - droppedAt
      - journalId
      properties:
        id:
          type: string
          format: uuid
        drawerSessionId:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
        amount:
          $ref: ./common.yaml#/components/schemas/Money
        reference:
          type: string
        droppedAt:
          type: string
          format: date-time
        journalId:
          type: string
          format: uuid
    CashDropRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - drawerSessionId
      - amount
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the caller.
        drawerSessionId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        reference:
          type: string
          minLength: 1
          maxLength: 60
        droppedAt:
          type: string
          format: date-time
          description: Default now.
    PeriodStatus:
      type: string
      enum:
      - OPEN
      - CLOSING
      - CLOSED
    FiscalPeriod:
      type: object
      required:
      - period
      - status
      - yearEnd
      properties:
        period:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        status:
          $ref: '#/components/schemas/PeriodStatus'
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
          format: uuid
        yearEnd:
          type: boolean
          description: The last period of the fiscal year.
    CloseChecks:
      type: object
      required:
      - period
      - failedEvents
      - posClearingDifferences
      - unreconciledDrawers
      - ready
      properties:
        period:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        failedEvents:
          type: integer
          format: int32
          description: Parked failed events of the tenant.
        posClearingDifferences:
          type: array
          items:
            type: object
            required:
            - billId
            - amount
            properties:
              billId:
                type: string
                format: uuid
              amount:
                $ref: ./common.yaml#/components/schemas/Money
        unreconciledDrawers:
          type: array
          items:
            type: object
            required:
            - sessionId
            - registerId
            - openedAt
            properties:
              sessionId:
                type: string
                format: uuid
              registerId:
                type: string
                format: uuid
              openedAt:
                type: string
                format: date-time
        ready:
          type: boolean
          description: True when nothing stands in the way.
    ClosePeriodRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgedBillIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
          description: Bills whose POS clearing difference is accepted as it is.
        note:
          type: string
          maxLength: 500
    RebuildResult:
      type: object
      required:
      - parties
      - changed
      properties:
        parties:
          type: integer
          format: int32
        changed:
          type: integer
          format: int32
          description: Balances that differed from the recomputation.
