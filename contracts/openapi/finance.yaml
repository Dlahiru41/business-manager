openapi: 3.1.0
info:
  title: BMP Finance API
  version: 1.0.0
  description: |
    Double-entry ledger, expenses, receivables, payables and periods (phase 04, rules FIN-01..FIN-11).

    Every money effect of the other modules becomes one balanced journal, posted automatically from their events
    (posting-rules.md §2) and idempotent on the source event (FIN-02, FIN-03). Journals never change: corrections
    are reversing journals (FIN-04). Postings dated in a closed period land in the first open one (FIN-05). Credit
    bills open receivables and supplier invoices open payables; collections and supplier payments settle them
    oldest first unless allocated (FIN-07). Amounts in requests are decimal strings; in responses `Money`.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Accounts
  description: Chart of accounts (FIN-01).
- name: Journals
  description: 'Journal entries: automatic, manual and reversals (FIN-02..FIN-04).'
- name: Ledger
  description: Trial balance and profit and loss.
- name: Expenses
  description: Expense categories and expenses (FIN-09).
- name: Receivables
  description: Customer open items and statements (FIN-07, FIN-08, FIN-10).
- name: Payables
  description: Supplier open items, statements and payments (FIN-07, FIN-11).
- name: CashDrops
  description: Cash taken from drawers to the bank.
- name: Periods
  description: Fiscal periods and their close (FIN-05, FIN-06).
- name: Administration
  description: Projection rebuilds.
paths:
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      operationId: listAccounts
      summary: The chart of accounts, by code (FIN-01)
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AccountType'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AccountStatus'
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
              example:
                items:
                - id: 0194a000-0000-7000-8000-000000006400
                  code: '6400'
                  name: Packing materials
                  type: EXPENSE
                  systemKey: EXP_PACKING
                  status: ACTIVE
                  version: 0
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - Accounts
      operationId: createAccount
      summary: Add an account to the chart
      x-permission: finance:write
      x-error-codes:
      - VALIDATION_FAILED
      - ACCOUNT_CODE_TAKEN
      - UNKNOWN_PARENT_ACCOUNT
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              id: 0194a000-0000-7000-8000-000000006410
              code: '6410'
              name: Bottles and caps
              type: EXPENSE
              parentId: 0194a000-0000-7000-8000-000000006400
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0194a000-0000-7000-8000-000000006410
                code: '6410'
                name: Bottles and caps
                type: EXPENSE
                parentId: 0194a000-0000-7000-8000-000000006400
                status: ACTIVE
                version: 0
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/accounts/{accountId}:
    get:
      tags:
      - Accounts
      operationId: getAccount
      summary: One account
      x-permission: finance:read
      x-error-codes:
      - ACCOUNT_NOT_FOUND
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0194a000-0000-7000-8000-000000006400
                code: '6400'
                name: Packing materials
                type: EXPENSE
                systemKey: EXP_PACKING
                status: ACTIVE
                version: 0
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
    patch:
      tags:
      - Accounts
      operationId: updateAccount
      summary: Rename, renumber or deactivate an account (FIN-01)
      description: Accounts with a `systemKey` keep their type and stay active; they may be renamed and renumbered.
      x-permission: finance:write
      x-error-codes:
      - VALIDATION_FAILED
      - ACCOUNT_NOT_FOUND
      - ACCOUNT_CODE_TAKEN
      - SYSTEM_ACCOUNT_LOCKED
      - PRECONDITION_REQUIRED
      - VERSION_CONFLICT
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            example:
              name: Packing materials (bottles, caps, bags)
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0194a000-0000-7000-8000-000000006400
                code: '6400'
                name: Packing materials (bottles, caps, bags)
                type: EXPENSE
                systemKey: EXP_PACKING
                status: ACTIVE
                version: 1
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '412':
          $ref: ./common.yaml#/components/responses/PreconditionFailed
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
        '428':
          $ref: ./common.yaml#/components/responses/PreconditionRequired
  /api/v1/journals:
    get:
      tags:
      - Journals
      operationId: listJournals
      summary: Journal entries, newest first
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
      - name: sourceType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SourceType'
      - name: sourceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: accountId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Entries with a line on this account.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: First entry date.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Last entry date.
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalEntry'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
              example:
                items:
                - id: 0194a100-0000-7000-8000-000000000001
                  number: JE-000042
                  entryDate: '2026-11-25'
                  period: 2026-11
                  sourceType: EXPENSE
                  sourceId: 0194a200-0000-7000-8000-000000000001
                  memo: 200 empty bottles
                  postedAt: '2026-11-25T10:15:00Z'
                  postedBy: 0193a6f1-0000-7000-8000-00000000f001
                  lines:
                  - id: 0194a110-0000-7000-8000-000000000001
                    accountId: 0194a000-0000-7000-8000-000000006400
                    accountCode: '6400'
                    systemKey: EXP_PACKING
                    debit:
                      amount: '2000.00'
                      currency: LKR
                    credit:
                      amount: '0.00'
                      currency: LKR
                  - id: 0194a110-0000-7000-8000-000000000002
                    accountId: 0194a000-0000-7000-8000-000000001000
                    accountCode: '1000'
                    systemKey: CASH_DRAWER
                    debit:
                      amount: '0.00'
                      currency: LKR
                    credit:
                      amount: '2000.00'
                      currency: LKR
                  totalDebit:
                    amount: '2000.00'
                    currency: LKR
                  totalCredit:
                    amount: '2000.00'
                    currency: LKR
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - Journals
      operationId: createJournal
      summary: Post a manual journal (FIN-04)
      description: Needs a memo; debits must equal credits. A date in a closed period is posted to the first open period with
        the memo `late posting for <date>` (FIN-05).
      x-permission: finance:journal
      x-error-codes:
      - VALIDATION_FAILED
      - JOURNAL_UNBALANCED
      - UNKNOWN_ACCOUNT
      - ACCOUNT_INACTIVE
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualJournalRequest'
            example:
              id: 0194a100-0000-7000-8000-000000000099
              entryDate: '2026-11-30'
              memo: Owner's capital paid into the bank
              lines:
              - accountId: 0194a000-0000-7000-8000-000000001010
                debit: '100000.00'
              - accountId: 0194a000-0000-7000-8000-000000003000
                credit: '100000.00'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
              example:
                id: 0194a100-0000-7000-8000-000000000099
                number: JE-000043
                entryDate: '2026-11-30'
                period: 2026-11
                sourceType: MANUAL
                sourceId: 0194a100-0000-7000-8000-000000000099
                memo: Owner's capital paid into the bank
                postedAt: '2026-11-25T10:15:00Z'
                postedBy: 0193a6f1-0000-7000-8000-00000000f001
                lines:
                - id: 0194a110-0000-7000-8000-000000000001
                  accountId: 0194a000-0000-7000-8000-000000006400
                  accountCode: '6400'
                  systemKey: EXP_PACKING
                  debit:
                    amount: '2000.00'
                    currency: LKR
                  credit:
                    amount: '0.00'
                    currency: LKR
                - id: 0194a110-0000-7000-8000-000000000002
                  accountId: 0194a000-0000-7000-8000-000000001000
                  accountCode: '1000'
                  systemKey: CASH_DRAWER
                  debit:
                    amount: '0.00'
                    currency: LKR
                  credit:
                    amount: '2000.00'
                    currency: LKR
                totalDebit:
                  amount: '2000.00'
                  currency: LKR
                totalCredit:
                  amount: '2000.00'
                  currency: LKR
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/journals/{journalId}:
    get:
      tags:
      - Journals
      operationId: getJournal
      summary: One journal entry with its lines
      x-permission: finance:read
      x-error-codes:
      - JOURNAL_NOT_FOUND
      parameters:
      - name: journalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
              example:
                id: 0194a100-0000-7000-8000-000000000001
                number: JE-000042
                entryDate: '2026-11-25'
                period: 2026-11
                sourceType: EXPENSE
                sourceId: 0194a200-0000-7000-8000-000000000001
                memo: 200 empty bottles
                postedAt: '2026-11-25T10:15:00Z'
                postedBy: 0193a6f1-0000-7000-8000-00000000f001
                lines:
                - id: 0194a110-0000-7000-8000-000000000001
                  accountId: 0194a000-0000-7000-8000-000000006400
                  accountCode: '6400'
                  systemKey: EXP_PACKING
                  debit:
                    amount: '2000.00'
                    currency: LKR
                  credit:
                    amount: '0.00'
                    currency: LKR
                - id: 0194a110-0000-7000-8000-000000000002
                  accountId: 0194a000-0000-7000-8000-000000001000
                  accountCode: '1000'
                  systemKey: CASH_DRAWER
                  debit:
                    amount: '0.00'
                    currency: LKR
                  credit:
                    amount: '2000.00'
                    currency: LKR
                totalDebit:
                  amount: '2000.00'
                  currency: LKR
                totalCredit:
                  amount: '2000.00'
                  currency: LKR
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
  /api/v1/journals/{journalId}/reverse:
    post:
      tags:
      - Journals
      operationId: reverseJournal
      summary: Reverse a journal with a new entry (FIN-04)
      description: 'Journals never change: the reversal swaps every line''s debit and credit and points back with `reversesId`.'
      x-permission: finance:journal
      x-error-codes:
      - VALIDATION_FAILED
      - JOURNAL_NOT_FOUND
      - JOURNAL_ALREADY_REVERSED
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - name: journalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseJournalRequest'
            example:
              id: 0194a100-0000-7000-8000-000000000100
              memo: Posted to the wrong account
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
              example:
                id: 0194a100-0000-7000-8000-000000000100
                number: JE-000044
                entryDate: '2026-11-25'
                period: 2026-11
                sourceType: REVERSAL
                sourceId: 0194a100-0000-7000-8000-000000000001
                memo: Posted to the wrong account
                postedAt: '2026-11-25T10:15:00Z'
                postedBy: 0193a6f1-0000-7000-8000-00000000f001
                lines:
                - id: 0194a110-0000-7000-8000-000000000001
                  accountId: 0194a000-0000-7000-8000-000000006400
                  accountCode: '6400'
                  systemKey: EXP_PACKING
                  debit:
                    amount: '0.00'
                    currency: LKR
                  credit:
                    amount: '2000.00'
                    currency: LKR
                - id: 0194a110-0000-7000-8000-000000000002
                  accountId: 0194a000-0000-7000-8000-000000001000
                  accountCode: '1000'
                  systemKey: CASH_DRAWER
                  debit:
                    amount: '2000.00'
                    currency: LKR
                  credit:
                    amount: '0.00'
                    currency: LKR
                totalDebit:
                  amount: '2000.00'
                  currency: LKR
                totalCredit:
                  amount: '2000.00'
                  currency: LKR
                reversesId: 0194a100-0000-7000-8000-000000000001
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/ledger/trial-balance:
    get:
      tags:
      - Ledger
      operationId: getTrialBalance
      summary: Trial balance of every account
      description: Balances up to and including `asOf` (default today), or of the journals of one `period`. Σ debit = Σ credit
        always.
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: asOf
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
              example:
                asOf: '2026-11-30'
                rows:
                - accountId: 0194a000-0000-7000-8000-000000001000
                  code: '1000'
                  name: Cash in drawer
                  type: ASSET
                  systemKey: CASH_DRAWER
                  debit:
                    amount: '52300.00'
                    currency: LKR
                  credit:
                    amount: '41200.00'
                    currency: LKR
                  balance:
                    amount: '11100.00'
                    currency: LKR
                - accountId: 0194a000-0000-7000-8000-000000006400
                  code: '6400'
                  name: Packing materials
                  type: EXPENSE
                  systemKey: EXP_PACKING
                  debit:
                    amount: '2000.00'
                    currency: LKR
                  credit:
                    amount: '0.00'
                    currency: LKR
                  balance:
                    amount: '2000.00'
                    currency: LKR
                totalDebit:
                  amount: '54300.00'
                  currency: LKR
                totalCredit:
                  amount: '54300.00'
                  currency: LKR
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /api/v1/ledger/profit-and-loss:
    get:
      tags:
      - Ledger
      operationId: getProfitAndLoss
      summary: Profit and loss over periods (posting-rules.md §4)
      description: (SALES − SALES_RETURNS − SALES_DISCOUNTS) − COGS − WASTAGE − COUNT_VARIANCE − PPV − CASH_OVER_SHORT − operating
        expenses, from the journals of the periods `from` to `to` (inclusive). Year-end closing entries are left out.
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
      - name: to
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-11
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitAndLoss'
              example:
                from: 2026-11
                to: 2026-11
                revenue:
                  amount: '152000.00'
                  currency: LKR
                returns:
                  amount: '1500.00'
                  currency: LKR
                discounts:
                  amount: '800.00'
                  currency: LKR
                netRevenue:
                  amount: '149700.00'
                  currency: LKR
                costOfGoodsSold:
                  amount: '118250.40'
                  currency: LKR
                wastage:
                  amount: '620.00'
                  currency: LKR
                countVariance:
                  amount: '0.00'
                  currency: LKR
                purchasePriceVariance:
                  amount: '150.00'
                  currency: LKR
                cashOverShort:
                  amount: '100.00'
                  currency: LKR
                operatingExpenses:
                  amount: '32000.00'
                  currency: LKR
                profit:
                  amount: '-1420.40'
                  currency: LKR
                accounts:
                - accountId: 0194a000-0000-7000-8000-000000006000
                  code: '6000'
                  name: Rent
                  type: EXPENSE
                  systemKey: EXP_RENT
                  amount:
                    amount: '25000.00'
                    currency: LKR
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /api/v1/expense-categories:
    get:
      tags:
      - Expenses
      operationId: listExpenseCategories
      summary: Expense categories
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategory'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
              example:
                items:
                - id: 0194a300-0000-7000-8000-000000000064
                  code: PACKING
                  name: Packing materials
                  accountId: 0194a000-0000-7000-8000-000000006400
                  status: ACTIVE
                  version: 0
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - Expenses
      operationId: createExpenseCategory
      summary: Add an expense category (FIN-09)
      x-permission: finance:write
      x-error-codes:
      - VALIDATION_FAILED
