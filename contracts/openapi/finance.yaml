                    $ref: ./common.yaml#/components/schemas/PageInfo
              example:
                items:
                - id: 0194a500-0000-7000-8000-000000000001
                  drawerSessionId: 0193d300-0000-7000-8000-000000000001
                  registerId: 0193d100-0000-7000-8000-000000000001
                  amount:
                    amount: '40000.00'
                    currency: LKR
                  reference: Deposit slip 0912
                  droppedAt: '2026-11-25T17:00:00Z'
                  journalId: 0194a100-0000-7000-8000-000000000001
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - CashDrops
      operationId: recordCashDrop
      summary: Take cash from a drawer to the bank
      description: Records a DROP on the open drawer and posts Dr BANK / Cr CASH_DRAWER.
      x-permission: finance:cash-drop
      x-error-codes:
      - VALIDATION_FAILED
      - DRAWER_SESSION_NOT_FOUND
      - DRAWER_NOT_OPEN
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashDropRequest'
            example:
              id: 0194a500-0000-7000-8000-000000000001
              drawerSessionId: 0193d300-0000-7000-8000-000000000001
              amount: '40000.00'
              reference: Deposit slip 0912
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashDrop'
              example:
                id: 0194a500-0000-7000-8000-000000000001
                drawerSessionId: 0193d300-0000-7000-8000-000000000001
                registerId: 0193d100-0000-7000-8000-000000000001
                amount:
                  amount: '40000.00'
                  currency: LKR
                reference: Deposit slip 0912
                droppedAt: '2026-11-25T17:00:00Z'
                journalId: 0194a100-0000-7000-8000-000000000001
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/periods:
    get:
      tags:
      - Periods
      operationId: listPeriods
      summary: Fiscal periods with postings, newest first (FIN-05)
      x-permission: finance:read
      x-error-codes:
      - INVALID_PARAMETER
      parameters:
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FiscalPeriod'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
              example:
                items:
                - period: 2026-11
                  status: CLOSED
                  closedAt: '2026-12-02T08:00:00Z'
                  closedBy: 0193a6f1-0000-7000-8000-00000000f001
                  yearEnd: false
                - period: 2026-12
                  status: OPEN
                  yearEnd: true
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /api/v1/periods/{period}:
    get:
      tags:
      - Periods
      operationId: getPeriod
      summary: One period (OPEN when nothing was closed)
      x-permission: finance:read
      x-error-codes:
      - INVALID_PERIOD
      parameters:
      - name: period
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriod'
              example:
                period: 2026-11
                status: CLOSED
                closedAt: '2026-12-02T08:00:00Z'
                closedBy: 0193a6f1-0000-7000-8000-00000000f001
                yearEnd: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/periods/{period}/close-checks:
    get:
      tags:
      - Periods
      operationId: getCloseChecks
      summary: What stands in the way of closing a period (FIN-06)
      x-permission: finance:read
      x-error-codes:
      - INVALID_PERIOD
      parameters:
      - name: period
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseChecks'
              example:
                period: 2026-11
                failedEvents: 0
                posClearingDifferences:
                - billId: 0193f100-0000-7000-8000-000000000001
                  amount:
                    amount: '-0.01'
                    currency: LKR
                unreconciledDrawers: []
                ready: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/periods/{period}/close:
    post:
      tags:
      - Periods
      operationId: closePeriod
      summary: Close a period (FIN-06)
      description: |
        Runs in the background (202 with an operation, `GET /api/v1/operations/{id}`). The close
        needs no parked failed events of the tenant, POS clearing at zero for every bill of the
        period (or the bills listed in `acknowledgedBillIds`) and every drawer session opened in
        the period reconciled; otherwise the operation fails with `FAILED_EVENTS_PENDING`,
        `POS_CLEARING_NOT_ZERO` or `DRAWERS_NOT_RECONCILED` and the period stays open. Closing the
        last period of the fiscal year (`finance.fiscalYearStartMonth`) first moves the year's
        income and expenses to retained earnings. Publishes `PeriodClosed`.
      x-permission: finance:close-period
      x-error-codes:
      - VALIDATION_FAILED
      - INVALID_PERIOD
      - PERIOD_NOT_ENDED
      - PERIOD_ALREADY_CLOSED
      - PERIOD_CLOSE_IN_PROGRESS
      - EARLIER_PERIOD_OPEN
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - name: period
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePeriodRequest'
            example:
              acknowledgedBillIds:
              - 0193f100-0000-7000-8000-000000000001
              note: 0.01 rounding on one offline bill
      responses:
        '202':
          description: 'Accepted: the operation runs in the background.'
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/Operation
              example:
                id: 0194a600-0000-7000-8000-000000000001
                type: PERIOD_CLOSE
                status: PENDING
                progress: 0
                createdAt: '2026-12-02T08:00:00Z'
                updatedAt: '2026-12-02T08:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
  /api/v1/admin/finance/party-balances/rebuild:
    post:
      tags:
      - Administration
      operationId: rebuildPartyBalances
      summary: Recompute party balances from the open items
      description: The projection is kept in the posting transaction; this recomputes it (06 §6).
      x-permission: finance:admin
      x-error-codes:
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildResult'
              example:
                parties: 42
                changed: 0
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common.yaml#/components/securitySchemes/bearerAuth
  schemas:
    Amount:
      type: string
      description: A non-negative money amount with up to 4 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      example: '2000.00'
    SignedAmount:
      type: string
      description: A signed money amount with up to 4 decimals.
      pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      example: '-150.00'
    AccountType:
      type: string
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - INCOME
      - EXPENSE
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    SystemKey:
      type: string
      description: Fixed meaning of a seeded account (posting-rules.md §1).
      enum:
      - CASH_DRAWER
      - BANK
      - CARD_CLEARING
      - TRANSFER_CLEARING
      - CHEQUES
      - AR
      - POS_CLEARING
      - INVENTORY
      - AP
      - GRNI
      - TAX_PAYABLE
      - CUSTOMER_CREDIT
      - EQUITY
      - RETAINED_EARNINGS
      - SALES
      - SALES_RETURNS
      - SALES_DISCOUNTS
      - COGS
      - WASTAGE
      - COUNT_VARIANCE
      - PPV
      - CASH_OVER_SHORT
      - EXP_RENT
      - EXP_UTILITIES
      - EXP_WAGES
      - EXP_TRANSPORT
      - EXP_PACKING
      - EXP_REPAIRS
      - EXP_OTHER
    SourceType:
      type: string
      description: What a journal was posted for.
      enum:
      - SALE
      - BILL_PAYMENT
      - COLLECTION
      - STOCK_ISSUE
      - SALE_RETURN
      - PAYMENT_REFUND
      - SALE_VOID
      - GOODS_RECEIPT
      - STOCK_RECEIPT
      - SUPPLIER_INVOICE
      - SUPPLIER_PAYMENT
      - STOCK_ADJUSTMENT
      - STOCK_COUNT
      - STOCK_TRANSFORMATION
      - EXPENSE
      - DRAWER_RECONCILIATION
      - CASH_DROP
      - YEAR_END_CLOSE
      - MANUAL
      - REVERSAL
    Account:
      type: object
      required:
      - id
      - code
      - name
      - type
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        subtype:
          type: string
        parentId:
          type: string
          format: uuid
        systemKey:
          $ref: '#/components/schemas/SystemKey'
