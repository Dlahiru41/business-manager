openapi: 3.1.0
info:
  title: BMP Identity and Access API
  version: 1.0.0
  description: |
    Users, roles and permissions, the caller's identity, and registered devices (phase 00, T00-08). Credentials live in
    Keycloak; this API never accepts or stores passwords.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Users
  - name: Roles
  - name: Me
  - name: Devices

paths:
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the tenant's users
      x-permission: iam:users
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
              examples:
                default:
                  $ref: "#/components/examples/UserPage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user in the identity provider and the tenant
      description: The identity provider asks the user to set a password (e-mail when given); no password is accepted here.
      x-permission: iam:users
      x-error-codes: [VALIDATION_FAILED, UNKNOWN_ROLE, INVALID_LOCATION, USERNAME_TAKEN, ROLE_GRANT_EXCEEDS_CALLER, IDENTITY_PROVIDER_REJECTED, IDENTITY_PROVIDER_UNAVAILABLE, IDENTITY_PROVIDER_MISCONFIGURED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              username: nimal.cashier
              email: nimal@example.lk
              displayName: Nimal
              roles:
                - code: CASHIER
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  $ref: "#/components/examples/User"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/v1/users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      x-permission: iam:users
      x-error-codes: [USER_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: The user.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  $ref: "#/components/examples/User"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user; the last active owner cannot be disabled (IAM-01)
      x-permission: iam:users
      x-error-codes: [USER_NOT_FOUND, LAST_OWNER, INVALID_LOCATION, ROLE_GRANT_EXCEEDS_CALLER, PRECONDITION_REQUIRED, VERSION_CONFLICT, IDENTITY_PROVIDER_UNAVAILABLE, IDENTITY_PROVIDER_MISCONFIGURED]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              status: DISABLED
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  $ref: "#/components/examples/User"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/v1/users/{userId}/roles:
    put:
      tags: [Users]
      operationId: replaceUserRoles
      summary: Replace the user's roles; the last active owner keeps OWNER (IAM-01)
      x-permission: iam:users
      x-error-codes: [USER_NOT_FOUND, UNKNOWN_ROLE, LAST_OWNER, ROLE_GRANT_EXCEEDS_CALLER, PRECONDITION_REQUIRED, VERSION_CONFLICT, IDENTITY_PROVIDER_UNAVAILABLE, IDENTITY_PROVIDER_MISCONFIGURED]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolesRequest"
            example:
              roles:
                - code: CASHIER
                  locationScope: [01934f5a-6d1c-7000-8000-000000000c01]
      responses:
        "200":
          description: The user with its new roles.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  $ref: "#/components/examples/User"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List the tenant's roles (system roles first)
      x-permission: iam:roles
      x-error-codes: []
      responses:
        "200":
          description: Every role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
              examples:
                default:
                  $ref: "#/components/examples/RoleList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a custom role
      x-permission: iam:roles
      x-error-codes: [VALIDATION_FAILED, INVALID_PERMISSION, ROLE_CODE_TAKEN, ROLE_GRANT_EXCEEDS_CALLER, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
            example:
              code: SUPERVISOR
              name: Shift supervisor
              permissions: ["sales:*", "catalog:read"]
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
              examples:
                default:
                  $ref: "#/components/examples/Role"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/roles/{roleId}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: Get a role
      x-permission: iam:roles
      x-error-codes: [ROLE_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
      responses:
        "200":
          description: The role.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
              examples:
                default:
                  $ref: "#/components/examples/Role"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: Rename a role, change its permissions or deactivate it (system roles cannot be deactivated — IAM-02)
      x-permission: iam:roles
      x-error-codes: [ROLE_NOT_FOUND, INVALID_PERMISSION, SYSTEM_ROLE_IMMUTABLE, ROLE_GRANT_EXCEEDS_CALLER, PRECONDITION_REQUIRED, VERSION_CONFLICT]
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
            example:
              permissions: ["sales:*", "catalog:read", "tenant:read"]
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
              examples:
                default:
                  $ref: "#/components/examples/Role"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The authenticated caller
      x-permission: authenticated
      x-error-codes: []
      responses:
        "200":
          description: Who is calling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                default:
                  $ref: "#/components/examples/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/v1/me/permissions:
    get:
      tags: [Me]
      operationId: getMyPermissions
      summary: The caller's effective permission grants
      x-permission: authenticated
      x-error-codes: []
      responses:
        "200":
          description: Permission grants (patterns such as `sales:*`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permissions"
              example:
                permissions: ["catalog:read", "sales:create"]
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/v1/devices:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register a till; returns its client credential once
      description: |
        The client secret is returned only in this response and is never stored by the platform. An idempotent replay
        returns the device without the secret.
      x-permission: iam:devices
      x-error-codes: [VALIDATION_FAILED, INVALID_LOCATION, IDENTITY_PROVIDER_UNAVAILABLE, IDENTITY_PROVIDER_MISCONFIGURED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
            example:
              name: Till 1
              locationId: 01934f5a-6d1c-7000-8000-000000000c01
      responses:
        "201":
          description: Registered.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration"
              examples:
                default:
                  $ref: "#/components/examples/DeviceRegistration"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/v1/devices/{deviceId}/revoke:
    post:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device; its tokens are rejected at once on this instance and within 60 s everywhere (IAM-03)
      x-permission: iam:devices
      x-error-codes: [DEVICE_NOT_FOUND, DEVICE_ALREADY_REVOKED, IDENTITY_PROVIDER_UNAVAILABLE, IDENTITY_PROVIDER_MISCONFIGURED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/DeviceIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeDeviceRequest"
            example:
              reason: Till stolen
      responses:
        "200":
          description: Revoked.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
              examples:
                default:
                  $ref: "#/components/examples/Device"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "500":
          $ref: "./common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      $ref: "./common.yaml#/components/securitySchemes/bearerAuth"

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RoleCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{1,39}$"
    Permission:
      type: string
      pattern: "^(\\*|[a-z][a-z-]*:(\\*|[a-z][a-z-]*))$"
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/RoleCode"
        locationScope:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    User:
      type: object
      required: [id, idpSubject, displayName, status, roles, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        idpSubject:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        defaultLocationId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, roles]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{2,59}$"
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        defaultLocationId:
          type: string
          format: uuid
        roles:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RoleAssignment"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        defaultLocationId:
          type: string
          format: uuid
    ReplaceRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RoleAssignment"
    Role:
      type: object
      required: [id, code, name, system, status, permissions, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/RoleCode"
        name:
          type: string
        system:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        version:
          type: integer
          format: int64
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [code, name, permissions]
      properties:
        code:
          $ref: "#/components/schemas/RoleCode"
        name:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Permission"
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Permission"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    Me:
      type: object
      required: [userId, roles, platformAdmin]
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        platformAdmin:
          type: boolean
        displayName:
          type: string
        defaultLocationId:
          type: string
          format: uuid
    Permissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
    Device:
      type: object
      required: [id, name, locationId, clientId, status, registeredAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        locationId:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
        clientId:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        registeredAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    DeviceRegistration:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        clientSecret:
          type: string
          description: One-time credential for the client-credentials grant. Absent on idempotent replays.
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [name, locationId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        locationId:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
    RevokeDeviceRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

  examples:
    User:
      value:
        id: 01934f5a-6d1c-7000-8000-000000000f01
        idpSubject: 01934f5a-6d1c-7000-8000-000000000f01
        displayName: Nimal
        status: ACTIVE
        roles:
          - code: CASHIER
        version: 0
        createdAt: "2026-11-21T09:42:13Z"
    UserPage:
      value:
        items:
          - id: 01934f5a-6d1c-7000-8000-000000000f01
            idpSubject: 01934f5a-6d1c-7000-8000-000000000f01
            displayName: Nimal
            status: ACTIVE
            roles:
              - code: CASHIER
            version: 0
            createdAt: "2026-11-21T09:42:13Z"
        page:
          limit: 50
          hasMore: false
    Role:
      value:
        id: 01934f5a-6d1c-7000-8000-000000000f11
