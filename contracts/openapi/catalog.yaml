openapi: 3.1.0
info:
  title: BMP Catalog API
  version: 1.0.0
  description: |
    The dynamic product model (phase 01, rules CAT-01..CAT-14): units of measure, categories, products created from
    templates, attributes and the variant matrix, packaging units with barcodes, product conversions and
    transformation definitions. Nothing here is specific to one business: every product rule is data.

    Examples use the pilot shop: eggs (variant matrix colour × size), cooking oil (bulk break: an 18 kg can opened
    into bottles), branded soya meat (packets) and Karola dried fish (loose, repacked into own packets).

    Quantities, factors and percentages are decimal strings, never JSON numbers. Packaging units and attributes are
    parts of their variant / product: their ETag is the version of that variant / product.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Templates
    description: Product templates and the defaults they apply (CAT-09).
  - name: Units
    description: Units of measure — platform standard units and the tenant's own (CAT-01).
  - name: Categories
    description: Product categories, a tree.
  - name: Products
    description: Products, their conversions and variant generation.
  - name: Attributes
    description: Attribute types of a product (Colour, Size, Brand) with their values.
  - name: Variants
    description: Variants (SKUs), the things stock, cost and price attach to.
  - name: PackagingUnits
    description: Buy and sell units of a variant, as multiples of its base unit, and their barcodes.
  - name: TransformationDefinitions
    description: Recipes that turn input stock into output stock (open can, repack, break tray).
  - name: CatalogSync
    description: Versioned catalog snapshots for till caching.

paths:
  /api/v1/product-templates:
    get:
      tags: [Templates]
      operationId: listProductTemplates
      summary: The product templates and their defaults
      x-permission: catalog:read
      x-error-codes: []
      responses:
        "200":
          description: All templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTemplateList"
              example:
                items:
                  - code: BULK_BREAK
                    name: Bulk break
                    description: One variant with states SEALED/OPEN; the bulk unit is bought sealed and sold opened.
                    attributesRequired: false
                    defaultBaseUnit: ml
                    defaultStockStates: [SEALED, OPEN]
                    defaultSellMode: BREAK_ON_SALE
                    tracksStock: true
                    autoTransformations: [OPEN]
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/v1/units:
    get:
      tags: [Units]
      operationId: listUnits
      summary: Standard and tenant units of measure, standard first, then by code
      x-permission: catalog:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: dimension
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Dimension"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitPage"
              example:
                items:
                  - id: 0193a000-0000-7000-8000-000000000002
                    code: g
                    name: Gram
                    dimension: MASS
                    toSiFactor: "0.001"
                    standard: true
                  - id: 0193a000-0000-7000-8000-000000000003
                    code: kg
                    name: Kilogram
                    dimension: MASS
                    toSiFactor: "1"
                    standard: true
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [Units]
      operationId: createUnit
      summary: Add a tenant unit of measure (CAT-01)
      description: |
        Codes are unique across the standard units and the tenant's own. Without `toSiFactor` the unit converts only
        through packaging units and product conversions (CAT-03). Units are immutable once created.
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, UNIT_CODE_TAKEN, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
            example:
              code: bushel
              name: Bushel
              dimension: VOLUME
              toSiFactor: "35.2391"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
              example:
                id: 0193b000-0000-7000-8000-000000000601
                code: bushel
                name: Bushel
                dimension: VOLUME
                toSiFactor: "35.2391"
                standard: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: The tenant's categories, by name
      x-permission: catalog:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: parentId
          in: query
          required: false
          description: Only the direct children of this category.
          schema:
            type: string
            format: uuid
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
              example:
                items:
                  - id: 0193b000-0000-7000-8000-000000000501
                    name: Dry goods
                    ancestorIds: []
                    status: ACTIVE
                    version: 0
                    createdAt: "2026-11-21T09:42:13Z"
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Add a category
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, UNKNOWN_CATEGORY, CATEGORY_NAME_TAKEN, CATEGORY_TOO_DEEP, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
            example:
              name: Dried fish
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              examples:
                default:
                  $ref: "#/components/examples/Category"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/categories/{categoryId}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category
      x-permission: catalog:read
      x-error-codes: [CATEGORY_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/CategoryIdPath"
      responses:
        "200":
          description: The category.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              examples:
                default:
                  $ref: "#/components/examples/Category"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Rename, move or deactivate a category
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, CATEGORY_NOT_FOUND, UNKNOWN_CATEGORY, CATEGORY_NAME_TAKEN, CATEGORY_CYCLE, CATEGORY_TOO_DEEP]
      parameters:
        - $ref: "#/components/parameters/CategoryIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
            example:
              name: Dried fish and sprats
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              examples:
                default:
                  $ref: "#/components/examples/Category"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Products, by code
      x-permission: catalog:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on code or name.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
        - name: template
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductTemplateCode"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of products (without variants).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
              example:
                items:
                  - id: 0193b000-0000-7000-8000-000000000102
                    code: OIL
                    name: Cooking oil
                    template: BULK_BREAK
                    baseUnit: ml
                    tracking:
                      batches: false
                      expiry: false
                      serials: false
                      decimalQty: true
                      weighed: false
                    properties: {}
                    status: ACTIVE
                    attributes: []
                    exclusions: []
                    conversions:
                      - fromUnit: kg
                        toUnit: ml
                        factor: "1086.96"
                        source: DENSITY
                    variantCount: 1
                    version: 0
                    createdAt: "2026-11-21T09:42:13Z"
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product from a template with its attributes, variants and packaging units (CAT-02, CAT-05, CAT-09)
      description: |
        One call creates the product, generates its variants (the attribute matrix minus exclusions for
        `VARIANT_MATRIX` and `BRANDED_PACKET`, else one variant), gives every variant its base packaging unit plus
        the listed packaging units, and creates the transformation definitions the template implies (`BULK_BREAK`: an
        `OPEN` definition per bulk unit; `LOOSE_REPACK`: a `REPACK` definition per own packet), published.

        A listed packaging unit whose code is the base unit's code configures the base unit (its `qtyInBase` must be
        1). Without `stockState`, buyable units take the bulk state (`SEALED` for bulk break, `DEFAULT` otherwise)
        and, for loose repack, sell-only units get their own state `PACKED_<CODE>`.
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRODUCT_CODE_TAKEN, SKU_ALREADY_EXISTS, UNKNOWN_UNIT, UNKNOWN_CATEGORY, UNKNOWN_TAX_CATEGORY, ATTRIBUTES_REQUIRED, TOO_MANY_VARIANTS, INVALID_QTY_IN_BASE, INVALID_STOCK_STATE, UNIT_NOT_CONVERTIBLE, PACKAGING_UNIT_CODE_TAKEN, INVALID_CONVERSION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            examples:
              eggs:
                summary: Eggs, colour × size minus Golden Yellow XS/S/M = 12 variants
                value:
                  code: EGG
                  name: Eggs
                  template: VARIANT_MATRIX
                  baseUnit: piece
                  attributes:
                    - code: COLOUR
                      name: Colour
                      values:
                        - code: RED
                          value: Red
                        - code: WHITE
                          value: White
                        - code: GOLDEN_YELLOW
                          value: Golden Yellow
                    - code: SIZE
                      name: Size
                      values:
                        - code: XS
                          value: XS
                        - code: S
                          value: S
                        - code: M
                          value: M
                        - code: L
                          value: L
                        - code: XL
                          value: XL
                  exclusions:
                    - COLOUR: GOLDEN_YELLOW
                      SIZE: XS
                    - COLOUR: GOLDEN_YELLOW
                      SIZE: S
                    - COLOUR: GOLDEN_YELLOW
                      SIZE: M
                  packagingUnits:
                    - code: tray
                      name: Tray of 30
                      qtyInBase: "30"
                      canBuy: true
                      canSell: true
              oil:
                summary: Cooking oil, an 18 kg can opened into bottles
                value:
                  code: OIL
                  name: Cooking oil
                  template: BULK_BREAK
                  baseUnit: ml
                  conversions:
                    - fromUnit: kg
                      toUnit: ml
                      factor: "1086.96"
                      source: DENSITY
                  packagingUnits:
                    - code: can
                      name: Can 18 kg
                      definedAs:
                        value: "18"
                        unit: kg
                      canBuy: true
                      canSell: true
                    - code: bottle-1000
                      name: Bottle 1000 ml
                      qtyInBase: "1000"
                      canSell: true
                      isDefaultSell: true
                    - code: bottle-750
                      name: Bottle 750 ml
                      qtyInBase: "750"
                      canSell: true
                    - code: bottle-375
                      name: Bottle 375 ml
                      qtyInBase: "375"
                      canSell: true
                    - code: bottle-187
                      name: Bottle 187.5 ml
                      qtyInBase: "187.5"
                      canSell: true
              soyaBranded:
                summary: Branded soya meat, 2 brands × 2 packet sizes
                value:
                  code: SOYA
                  name: Soya meat
                  template: BRANDED_PACKET
                  attributes:
                    - code: BRAND
                      name: Brand
                      values:
                        - code: MSL
                          value: MySoy
                        - code: VTM
                          value: Vitamin Soy
                    - code: SIZE
                      name: Packet size
                      values:
                        - code: G90
                          value: 90 g
                        - code: G180
                          value: 180 g
              karola:
                summary: Karola dried fish, loose by weight with own 250 g and 500 g packets
                value:
                  code: KAROLA
                  name: Karola (dried fish)
                  template: LOOSE_REPACK
                  baseUnit: g
                  packagingUnits:
                    - code: kg
                      name: Kilogram
                      definedAs:
                        value: "1"
                        unit: kg
                      canBuy: true
                      canSell: true
                    - code: packet-250
                      name: Packet 250 g
                      qtyInBase: "250"
                      canSell: true
                    - code: packet-500
                      name: Packet 500 g
                      qtyInBase: "500"
                      canSell: true
      responses:
        "201":
          description: Created, with its variants and packaging units.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/products/{productId}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product, optionally with its variants and their packaging units
      x-permission: catalog:read
      x-error-codes: [PRODUCT_NOT_FOUND, INVALID_PARAMETER]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - name: include
          in: query
          required: false
          description: "`variants` adds the variants; `units` adds them with their packaging units (comma-separated)."
          schema:
            type: string
            pattern: '^(variants|units)(,(variants|units))?$'
            example: variants,units
      responses:
        "200":
          description: The product.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Change a product's name, category, tax category, tracking or properties (CAT-13)
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, PRODUCT_NOT_FOUND, UNKNOWN_CATEGORY, UNKNOWN_TAX_CATEGORY]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
            example:
              name: Coconut cooking oil
              taxCategoryId: 0193c000-0000-7000-8000-000000000801
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/products/{productId}/deactivate:
    post:
      tags: [Products]
      operationId: deactivateProduct
      summary: Deactivate a product and all its variants (CAT-11 — never deleted)
      x-permission: catalog:write
      x-error-codes: [PRODUCT_NOT_FOUND, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deactivated (idempotent when already inactive).
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/products/{productId}/reactivate:
    post:
      tags: [Products]
      operationId: reactivateProduct
      summary: Reactivate a product; its variants stay as they are
      x-permission: catalog:write
      x-error-codes: [PRODUCT_NOT_FOUND, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Active.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/products/{productId}/attributes:
    get:
      tags: [Attributes]
      operationId: listAttributes
      summary: The product's attribute types with their values, by sort order
      x-permission: catalog:read
      x-error-codes: [PRODUCT_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "200":
          description: The attribute types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeTypeList"
              example:
                items:
                  - id: 0193b000-0000-7000-8000-000000000401
                    code: COLOUR
                    name: Colour
                    sort: 1
                    values:
                      - id: 0193b000-0000-7000-8000-000000000411
                        code: RED
                        value: Red
                        sort: 1
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      tags: [Attributes]
      operationId: createAttribute
      summary: Add an attribute type to a product that has no variants yet
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRODUCT_NOT_FOUND, ATTRIBUTE_CODE_TAKEN, ATTRIBUTE_TYPES_LOCKED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
