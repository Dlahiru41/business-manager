  /api/v1/products/{productId}/conversions:
    put:
      tags: [Products]
      operationId: replaceProductConversions
      summary: Replace the product's conversions across dimensions (CAT-03, CAT-14)
      description: |
        E.g. oil: 1 kg = 1,086.96 ml (density 0.92), later a measured yield. Packaging units defined in another unit
        (`definedAs`, the 18 kg can) get their `qtyInBase` recomputed; this changes future conversions only.
        Changed variants publish `VariantUpdated`, and published definitions using a changed unit get a new
        published version.
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, PRODUCT_NOT_FOUND, UNKNOWN_UNIT, INVALID_CONVERSION, UNIT_NOT_CONVERTIBLE, INVALID_QTY_IN_BASE]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceConversionsRequest"
            example:
              conversions:
                - fromUnit: kg
                  toUnit: ml
                  factor: "1087.5"
                  source: MEASURED_YIELD
      responses:
        "200":
          description: The product with its new conversions.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              examples:
                default:
                  $ref: "#/components/examples/OilProduct"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/products/{productId}/variants:generate:
    post:
      tags: [Products]
      operationId: generateVariants
      summary: Regenerate the variant matrix (CAT-05)
      description: |
        `exclusions`, when given, replace the product's exclusions. Missing combinations are created (packaging
        units copied from the oldest active variant); existing variants are never deleted; active variants whose
        combination is now excluded are deactivated. `dryRun` reports the plan without changing anything.
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRODUCT_NOT_FOUND, PRODUCT_INACTIVE, UNKNOWN_ATTRIBUTE_VALUE, ATTRIBUTES_REQUIRED, TOO_MANY_VARIANTS, SKU_ALREADY_EXISTS, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateVariantsRequest"
            example:
              exclusions:
                - COLOUR: GOLDEN_YELLOW
                  SIZE: XS
                - COLOUR: GOLDEN_YELLOW
                  SIZE: S
                - COLOUR: GOLDEN_YELLOW
                  SIZE: M
              dryRun: true
      responses:
        "200":
          description: What was (or, for a dry run, would be) created and deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateVariantsResult"
              example:
                dryRun: true
                created:
                  - sku: EGG-RED-XXL
                    name: Eggs Red XXL
                    attributeValues:
                      COLOUR: RED
                      SIZE: XXL
                deactivated: []
                unchanged: 12
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

