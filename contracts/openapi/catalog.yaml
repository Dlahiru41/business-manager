        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/v1/variants:lookup:
    get:
      tags: [Variants]
      operationId: lookupVariant
      summary: Find a variant by barcode (with the packaging unit it maps to) or by SKU
      x-permission: catalog:read
      x-error-codes: [VARIANT_NOT_FOUND, INVALID_PARAMETER]
      parameters:
        - name: barcode
          in: query
          required: false
          description: Exactly one of `barcode` and `sku`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9.\-]{1,64}$'
        - name: sku
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$'
      responses:
        "200":
          description: The variant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantLookup"
              example:
                packagingUnitId: 0193b000-0000-7000-8000-000000000312
                variant:
                  id: 0193b000-0000-7000-8000-000000000211
                  productId: 0193b000-0000-7000-8000-000000000102
                  sku: OIL
                  name: Cooking oil
                  attributeValues: []
                  stockStates: [SEALED, OPEN]
                  sellMode: BREAK_ON_SALE
                  status: ACTIVE
                  sellable: true
                  purchasable: true
                  version: 1
                  createdAt: "2026-11-21T09:42:13Z"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/v1/variants:
    get:
      tags: [Variants]
      operationId: listVariants
      summary: Variants across products with their packaging units, by SKU (CAT-08 filters)
      x-permission: catalog:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: sellable
          in: query
          required: false
          schema:
            type: boolean
        - name: purchasable
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Case-insensitive match on SKU or name.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of variants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantPage"
              examples:
                default:
                  $ref: "#/components/examples/VariantPage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/v1/transformation-definitions:
    get:
      tags: [TransformationDefinitions]
      operationId: listTransformationDefinitions
      summary: Transformation definitions, by code
      x-permission: catalog:write
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransformationKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DefinitionStatus"
        - name: variantId
          in: query
          required: false
          description: Only definitions with a line for this variant.
          schema:
            type: string
            format: uuid
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinitionPage"
              example:
                items:
                  - id: 0193b000-0000-7000-8000-000000000701
                    code: OIL-OPEN-CAN
                    name: Open Can 18 kg
                    kind: OPEN
                    expectedYieldPct: "100"
                    defVersion: 1
                    status: PUBLISHED
                    lines:
                      - id: 0193b000-0000-7000-8000-000000000711
                        direction: IN
                        variantId: 0193b000-0000-7000-8000-000000000211
                        stockState: SEALED
                        qtyBase: "19565.28"
                        packagingUnitId: 0193b000-0000-7000-8000-000000000312
                        qty: "1"
                      - id: 0193b000-0000-7000-8000-000000000712
                        direction: OUT
                        variantId: 0193b000-0000-7000-8000-000000000211
                        stockState: OPEN
                        qtyBase: "19565.28"
                        packagingUnitId: 0193b000-0000-7000-8000-000000000312
                        qty: "1"
                        costSharePct: "100"
                    version: 1
                    createdAt: "2026-11-21T09:42:13Z"
                    publishedAt: "2026-11-21T09:42:13Z"
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [TransformationDefinitions]
      operationId: createTransformationDefinition
      summary: Create a draft transformation definition (CAT-10)
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, DEFINITION_CODE_TAKEN, DEFINITION_LINES_INVALID, COST_SHARE_INVALID, UNKNOWN_VARIANT, INVALID_STOCK_STATE, INVALID_QTY_IN_BASE, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransformationDefinitionRequest"
            example:
              code: EGG-BREAK-TRAY
              name: Break tray
              kind: BREAK
              lines:
                - direction: IN
                  variantId: 0193b000-0000-7000-8000-000000000201
                  stockState: DEFAULT
                  qtyBase: "30"
                - direction: OUT
                  variantId: 0193b000-0000-7000-8000-000000000201
                  stockState: DEFAULT
                  qtyBase: "30"
      responses:
        "201":
          description: Created as a draft.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinition"
              examples:
                default:
                  $ref: "#/components/examples/RepackDefinition"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/transformation-definitions/{definitionId}:
    get:
      tags: [TransformationDefinitions]
      operationId: getTransformationDefinition
      summary: Get a transformation definition
      x-permission: catalog:write
      x-error-codes: [TRANSFORMATION_DEFINITION_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/DefinitionIdPath"
      responses:
        "200":
          description: The definition.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinition"
              examples:
                default:
                  $ref: "#/components/examples/RepackDefinition"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [TransformationDefinitions]
      operationId: updateTransformationDefinition
      summary: Edit a definition; editing a published one starts a new draft version (CAT-10)
      x-permission: catalog:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, TRANSFORMATION_DEFINITION_NOT_FOUND, DEFINITION_RETIRED, DEFINITION_LINES_INVALID, COST_SHARE_INVALID, UNKNOWN_VARIANT, INVALID_STOCK_STATE, INVALID_QTY_IN_BASE]
      parameters:
        - $ref: "#/components/parameters/DefinitionIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransformationDefinitionRequest"
            example:
              expectedYieldPct: "98.5"
      responses:
        "200":
          description: Updated (status DRAFT).
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinition"
              examples:
                default:
                  $ref: "#/components/examples/RepackDefinition"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/transformation-definitions/{definitionId}/publish:
    post:
      tags: [TransformationDefinitions]
      operationId: publishTransformationDefinition
      summary: Publish the draft as the next immutable version (CAT-10)
      x-permission: catalog:write
      x-error-codes: [TRANSFORMATION_DEFINITION_NOT_FOUND, DEFINITION_ALREADY_PUBLISHED, DEFINITION_RETIRED, DEFINITION_LINES_INVALID, COST_SHARE_INVALID, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/DefinitionIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Published; `defVersion` is the new version.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinition"
              examples:
                default:
                  $ref: "#/components/examples/RepackDefinition"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/transformation-definitions/{definitionId}/retire:
    post:
      tags: [TransformationDefinitions]
      operationId: retireTransformationDefinition
      summary: Retire a definition (CAT-11 — never deleted); inventory stops offering it
      x-permission: catalog:write
      x-error-codes: [TRANSFORMATION_DEFINITION_NOT_FOUND, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/DefinitionIdPath"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Retired (idempotent when already retired).
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformationDefinition"
              examples:
                default:
                  $ref: "#/components/examples/RepackDefinition"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/catalog/snapshot:
    get:
      tags: [CatalogSync]
      operationId: getCatalogSnapshot
      summary: The whole catalog at its current version, or the changes since a version (for till caching)
      description: |
        Every catalog change takes the tenant's next catalog version. Without `sinceVersion` the response holds every
        unit, product and variant (inactive ones included, so a till can retire them); with it, only products and
        variants changed after that version. The ETag is the catalog version; an unchanged catalog answers 304.
      x-permission: catalog:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: sinceVersion
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "./common.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The snapshot or delta.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSnapshot"
              example:
                version: 42
                sinceVersion: 40
                full: false
                units:
                  - id: 0193a000-0000-7000-8000-000000000004
                    code: ml
                    name: Millilitre
                    dimension: VOLUME
                    toSiFactor: "0.001"
                    standard: true
                products: []
                variants: []
        "304":
          $ref: "./common.yaml#/components/responses/NotModified"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      $ref: "./common.yaml#/components/securitySchemes/bearerAuth"

  parameters:
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantIdPath:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeIdPath:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitIdPath:
      name: unitId
      in: path
      required: true
      description: Packaging unit id.
      schema:
        type: string
        format: uuid
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionIdPath:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BarcodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9.\-]{1,64}$'
        example: "4792173000011"

  schemas:
    Status:
      type: string
      enum: [ACTIVE, INACTIVE]
    Dimension:
      type: string
      enum: [COUNT, MASS, VOLUME, LENGTH, AREA, TIME]
    ProductTemplateCode:
      type: string
      enum: [SIMPLE, VARIANT_MATRIX, BULK_BREAK, BRANDED_PACKET, LOOSE_REPACK, RECIPE, SERVICE]
    SellMode:
      type: string
      enum: [PREPACKED, BREAK_ON_SALE]
    TransformationKind:
      type: string
      enum: [OPEN, REPACK, BREAK, RECIPE]
    DefinitionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    ConversionSource:
      type: string
      enum: [DENSITY, MEASURED_YIELD, STANDARD]
    Direction:
      type: string
      enum: [IN, OUT]
    Quantity:
      type: string
      description: A non-negative decimal with up to 6 decimals (numeric(20,6)).
      pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$'
      example: "187.5"
    Factor:
      type: string
      description: A non-negative decimal with up to 10 decimals (numeric(20,10)).
      pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,10})?$'
      example: "1086.96"
    Percent:
      type: string
      description: A percentage 0–100 with up to 3 decimals.
      pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,3})?$'
      example: "100"
    UnitCode:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.\-]{0,31}$'
      example: kg
    StockState:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,31}$'
      example: OPEN
    Sku:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}$'
      example: EGG-RED-L
    AttributeValueCodes:
      type: object
      description: 'Attribute code → value code, e.g. `{"COLOUR": "RED", "SIZE": "L"}`.'
      maxProperties: 10
      additionalProperties:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_]{0,29}$'

    ProductTemplate:
      type: object
      required: [code, name, description, attributesRequired, defaultBaseUnit, defaultStockStates, defaultSellMode, tracksStock, autoTransformations]
      properties:
        code:
          $ref: "#/components/schemas/ProductTemplateCode"
        name:
          type: string
        description:
          type: string
        attributesRequired:
          type: boolean
        defaultBaseUnit:
          type: string
        defaultStockStates:
          type: array
          items:
            type: string
        defaultSellMode:
          $ref: "#/components/schemas/SellMode"
        tracksStock:
          type: boolean
        autoTransformations:
          type: array
          items:
            $ref: "#/components/schemas/TransformationKind"
    ProductTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductTemplate"

    Unit:
      type: object
      required: [id, code, name, dimension, standard]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        dimension:
          $ref: "#/components/schemas/Dimension"
        toSiFactor:
          type: string
          description: Factor to the dimension's reference unit (kg, l, m, piece); absent when the unit has none.
        standard:
          type: boolean
          description: A platform standard unit, shared by every tenant.
    UnitPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreateUnitRequest:
      type: object
      additionalProperties: false
      required: [code, name, dimension]
      properties:
        code:
          $ref: "#/components/schemas/UnitCode"
        name:
          type: string
          minLength: 1
          maxLength: 60
        dimension:
          $ref: "#/components/schemas/Dimension"
        toSiFactor:
          $ref: "#/components/schemas/Factor"

    Category:
      type: object
      required: [id, name, ancestorIds, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
        ancestorIds:
          type: array
          description: From the root down to the parent.
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/Status"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CategoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type: string
          format: uuid
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type: string
          format: uuid
          description: Moves the category under another one.
        moveToRoot:
          type: boolean
          description: Moves the category to the top level (instead of `parentId`).
        status:
          $ref: "#/components/schemas/Status"

    Tracking:
      type: object
      additionalProperties: false
      properties:
        batches:
          type: boolean
        expiry:
          type: boolean
        serials:
          type: boolean
        decimalQty:
          type: boolean
          description: Quantities may be fractional (weighed or measured goods).
        weighed:
          type: boolean
          description: Sold by weight on a scale.
    Conversion:
      type: object
      additionalProperties: false
      required: [fromUnit, toUnit, factor, source]
      description: "1 `fromUnit` = `factor` `toUnit` for this product (the inverse is implied)."
      properties:
        fromUnit:
          $ref: "#/components/schemas/UnitCode"
        toUnit:
          $ref: "#/components/schemas/UnitCode"
        factor:
          $ref: "#/components/schemas/Factor"
        source:
          $ref: "#/components/schemas/ConversionSource"
    AttributeValue:
      type: object
      required: [id, code, value, sort]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        value:
          type: string
        sort:
          type: integer
          format: int32
    AttributeType:
      type: object
      required: [id, code, name, sort, values]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        sort:
          type: integer
          format: int32
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"
    AttributeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeType"
    NewAttributeValue:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        code:
          type: string
          description: Defaults to the value, upper-cased, with other characters as `_`.
          pattern: '^[A-Za-z0-9][A-Za-z0-9_]{0,29}$'
        value:
          type: string
          minLength: 1
          maxLength: 60
        sort:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
    NewAttribute:
      type: object
      additionalProperties: false
      required: [code, name, values]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,29}$'
        name:
          type: string
          minLength: 1
          maxLength: 60
        sort:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        values:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/NewAttributeValue"
    AttributeValueChange:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The value to change; without it the entry adds a value.
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_]{0,29}$'
        value:
          type: string
          minLength: 1
          maxLength: 60
        sort:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
    UpdateAttributeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        sort:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        values:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/AttributeValueChange"

    Product:
      type: object
      required: [id, code, name, template, baseUnit, tracking, properties, status, attributes, exclusions, conversions, variantCount, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/ProductTemplateCode"
        baseUnit:
          type: string
        tracking:
          $ref: "#/components/schemas/Tracking"
        taxCategoryId:
          type: string
          format: uuid
        properties:
          type: object
          description: Free product facts (origin, notes); not used by any rule.
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/Status"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AttributeType"
        exclusions:
          type: array
          description: Combinations never generated; a combination is excluded when it contains all codes of an entry.
          items:
            $ref: "#/components/schemas/AttributeValueCodes"
        conversions:
          type: array
          items:
            $ref: "#/components/schemas/Conversion"
        variantCount:
          type: integer
          format: int32
        variants:
          type: array
          description: With `include=variants` or `include=units`.
          items:
            $ref: "#/components/schemas/Variant"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    DefinedAs:
      type: object
      additionalProperties: false
      required: [value, unit]
      description: The packaging unit's size in another unit; `qtyInBase` follows from it through the unit converter.
      properties:
        value:
          $ref: "#/components/schemas/Quantity"
        unit:
          $ref: "#/components/schemas/UnitCode"
    NewPackagingUnit:
      type: object
      additionalProperties: false
      required: [code, name]
      description: Exactly one of `qtyInBase` and `definedAs`.
      properties:
        code:
          $ref: "#/components/schemas/UnitCode"
        name:
          type: string
          minLength: 1
          maxLength: 80
        qtyInBase:
          $ref: "#/components/schemas/Quantity"
        definedAs:
          $ref: "#/components/schemas/DefinedAs"
        stockState:
          $ref: "#/components/schemas/StockState"
        canBuy:
          type: boolean
        canSell:
          type: boolean
        isDefaultSell:
          type: boolean
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [code, name, template]
      properties:
        code:
          type: string
          description: Unique per tenant, stored upper-case; the SKU prefix (CAT-06).
          pattern: '^[A-Za-z0-9][A-Za-z0-9_\-]{0,19}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        template:
          $ref: "#/components/schemas/ProductTemplateCode"
        categoryId:
          type: string
          format: uuid
        baseUnit:
          $ref: "#/components/schemas/UnitCode"
        taxCategoryId:
          type: string
          format: uuid
        tracking:
          $ref: "#/components/schemas/Tracking"
        properties:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
            maxLength: 200
        attributes:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/NewAttribute"
        exclusions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AttributeValueCodes"
        stockStates:
          type: array
          description: Overrides the template's states.
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/StockState"
        sellMode:
          $ref: "#/components/schemas/SellMode"
        conversions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Conversion"
        packagingUnits:
          type: array
          description: Given to every variant, besides its base unit.
          maxItems: 30
          items:
            $ref: "#/components/schemas/NewPackagingUnit"
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        taxCategoryId:
          type: string
          format: uuid
        tracking:
          $ref: "#/components/schemas/Tracking"
        properties:
          type: object
          description: Replaces all properties.
          maxProperties: 30
          additionalProperties:
            type: string
            maxLength: 200
    ReplaceConversionsRequest:
      type: object
      additionalProperties: false
      required: [conversions]
      properties:
        conversions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Conversion"
    GenerateVariantsRequest:
      type: object
      additionalProperties: false
      properties:
        exclusions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AttributeValueCodes"
        dryRun:
          type: boolean
          default: false
    GeneratedVariant:
      type: object
      required: [sku, name, attributeValues]
      properties:
        id:
          type: string
          format: uuid
          description: Absent in a dry run for variants not created yet.
        sku:
          type: string
        name:
          type: string
        attributeValues:
          $ref: "#/components/schemas/AttributeValueCodes"
    GenerateVariantsResult:
      type: object
      required: [dryRun, created, deactivated, unchanged]
      properties:
        dryRun:
          type: boolean
        created:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedVariant"
        deactivated:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedVariant"
        unchanged:
          type: integer
          format: int32

    VariantAttributeValue:
      type: object
      required: [attributeId, attributeCode, valueId, valueCode, value]
      properties:
        attributeId:
          type: string
          format: uuid
        attributeCode:
          type: string
        valueId:
          type: string
          format: uuid
        valueCode:
          type: string
        value:
          type: string
    PackagingUnit:
      type: object
      required: [id, variantId, code, name, qtyInBase, stockState, isBase, canBuy, canSell, isDefaultSell, status, barcodes]
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        qtyInBase:
          type: string
        definedAs:
          $ref: "#/components/schemas/DefinedAs"
        stockState:
          type: string
        isBase:
          type: boolean
        canBuy:
          type: boolean
        canSell:
          type: boolean
        isDefaultSell:
          type: boolean
        status:
          $ref: "#/components/schemas/Status"
        barcodes:
          type: array
          items:
            type: string
    PackagingUnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PackagingUnit"
    Variant:
      type: object
      required: [id, productId, sku, name, attributeValues, stockStates, sellMode, status, sellable, purchasable, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        attributeValues:
          type: array
          items:
            $ref: "#/components/schemas/VariantAttributeValue"
        stockStates:
          type: array
          items:
            type: string
        sellMode:
          $ref: "#/components/schemas/SellMode"
        status:
          $ref: "#/components/schemas/Status"
        sellable:
          type: boolean
          description: Active with at least one active `canSell` packaging unit (CAT-08).
        purchasable:
          type: boolean
          description: Active with at least one active `canBuy` packaging unit (CAT-08).
        packagingUnits:
          type: array
          items:
            $ref: "#/components/schemas/PackagingUnit"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VariantPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    VariantLookup:
      type: object
      required: [variant]
      properties:
        variant:
          $ref: "#/components/schemas/Variant"
        packagingUnitId:
          type: string
          format: uuid
          description: The packaging unit the barcode maps to (barcode lookups only).
    CreateVariantRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        sku:
          $ref: "#/components/schemas/Sku"
        attributeValues:
          $ref: "#/components/schemas/AttributeValueCodes"
        stockStates:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/StockState"
        sellMode:
          $ref: "#/components/schemas/SellMode"
        packagingUnits:
          type: array
          description: Besides the base unit; default copies those of the product's oldest active variant.
          maxItems: 30
          items:
            $ref: "#/components/schemas/NewPackagingUnit"
    UpdateVariantRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        sku:
          $ref: "#/components/schemas/Sku"
        stockStates:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/StockState"
        sellMode:
          $ref: "#/components/schemas/SellMode"
    UpdatePackagingUnitRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        qtyInBase:
          $ref: "#/components/schemas/Quantity"
        definedAs:
          $ref: "#/components/schemas/DefinedAs"
        stockState:
          $ref: "#/components/schemas/StockState"
        canBuy:
          type: boolean
        canSell:
          type: boolean
        isDefaultSell:
          type: boolean
        status:
          $ref: "#/components/schemas/Status"
    AddBarcodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9.\-]{1,64}$'

    TransformationLine:
      type: object
      required: [id, direction, variantId, stockState, qtyBase]
      properties:
        id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/Direction"
        variantId:
          type: string
          format: uuid
        stockState:
          type: string
        qtyBase:
          type: string
          description: Quantity in the variant's base unit per run.
        packagingUnitId:
          type: string
          format: uuid
          description: |
            When the line is a number of packaging units; `qtyBase` then follows the unit's size (also after a
            conversion change, CAT-14). The unit only sizes the line; `stockState` says where stock moves.
        qty:
          type: string
        costSharePct:
          type: string
          description: OUT lines only; they sum to 100.
    TransformationDefinition:
      type: object
      required: [id, code, name, kind, defVersion, status, lines, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TransformationKind"
        expectedYieldPct:
          type: string
        defVersion:
          type: integer
          format: int32
          description: The latest published version (0 while never published).
        status:
          $ref: "#/components/schemas/DefinitionStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TransformationLine"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
    TransformationDefinitionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransformationDefinition"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    NewTransformationLine:
      type: object
      additionalProperties: false
      required: [direction, variantId]
      description: Either `qtyBase`, or `packagingUnitId` with `qty`.
      properties:
        direction:
          $ref: "#/components/schemas/Direction"
        variantId:
          type: string
          format: uuid
        stockState:
          $ref: "#/components/schemas/StockState"
        qtyBase:
          $ref: "#/components/schemas/Quantity"
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Quantity"
        costSharePct:
          $ref: "#/components/schemas/Percent"
    CreateTransformationDefinitionRequest:
      type: object
      additionalProperties: false
      required: [code, name, kind, lines]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_\-]{0,39}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/TransformationKind"
        expectedYieldPct:
          $ref: "#/components/schemas/Percent"
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/NewTransformationLine"
    UpdateTransformationDefinitionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        expectedYieldPct:
          $ref: "#/components/schemas/Percent"
        lines:
          type: array
          description: Replaces all lines.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/NewTransformationLine"

    CatalogSnapshot:
      type: object
      required: [version, full, units, products, variants]
      properties:
        version:
          type: integer
          format: int64
        sinceVersion:
          type: integer
          format: int64
        full:
          type: boolean
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

