openapi: 3.1.0
info:
  title: BMP Sync API
  version: 1.0.0
  description: 'Offline sync for tills (phase 03, rules SYN-01..SYN-08).


    Only device principals call it; the device must be active and bound to a register, whose location applies to every

    record (SYN-01). A till bootstraps every dataset it needs to sell offline (SYN-02) and then asks for what changed

    since its cursors (SYN-03). It uploads what it did offline in ordered batches of up to 1,000 records; each record is

    processed in its own transaction by the module that owns it and answered `ACCEPTED`, `DUPLICATE` or `REJECTED` with
    a

    problem; a record that depends on a rejected one is rejected with `DEPENDENCY_REJECTED` (SYN-04). A record''s id is
    its

    idempotency key, so a replayed batch returns the original answers (SYN-05). Gaps in a register''s bill numbers raise

    `BillNumberGapDetected` once (SYN-06); the `Device-Time` header measures the till''s clock skew (SYN-07); records older

    than `offlineMaxHours` are accepted and flagged `LATE_SYNC` (SYN-08).

    '
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Sync
  description: Bootstrap, changes and uploads of a till (SYN-01..SYN-08).
paths:
  /api/v1/sync/bootstrap:
    get:
      tags:
      - Sync
      operationId: bootstrap
      summary: Everything a till needs to sell offline (SYN-02)
      x-permission: sync:read
      x-error-codes:
      - DEVICE_REQUIRED
      - DEVICE_NOT_BOUND
      parameters:
      - name: Device-Time
        in: header
        required: false
        description: The till's clock when it sent the request (SYN-07).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
              example:
                deviceId: 0193a6f1-0000-7000-8000-00000000d001
                register:
                  id: 0193d100-0000-7000-8000-000000000001
                  code: R1
                  billPrefix: R1
                  lastNumber: 41
                  locationId: 0193b000-0000-7000-8000-000000000401
                datasets:
                  catalog:
                    version: c:118
                    data:
                      revision: 118
                      products: []
                  priceLists:
                    version: p:7
                    data:
                    - priceListId: 0193b000-0000-7000-8000-000000000501
                      version: 3
                  customers:
                    version: u:2026-11-25T08:00:00Z
                    data:
                    - id: 0193d000-0000-7000-8000-000000000102
                      displayName: Hotel Lake View
                      phoneLast4: '5678'
                      creditAllowed: true
                      creditLimit: '50000.00'
                serverTime: '2026-11-25T08:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /api/v1/sync/changes:
    get:
      tags:
      - Sync
      operationId: changes
      summary: What changed since the till's cursors (SYN-03)
      x-permission: sync:read
      x-error-codes:
      - DEVICE_REQUIRED
      - DEVICE_NOT_BOUND
      - INVALID_PARAMETER
      parameters:
      - name: cursors
        in: query
        required: true
        description: '`dataset:version` pairs separated by commas, as bootstrap and changes returned them.'
        schema:
          type: string
          maxLength: 2000
      - name: Device-Time
        in: header
        required: false
        description: The till's clock when it sent the request (SYN-07).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
              example:
                datasets:
                  customers:
                    version: u:2026-11-25T08:00:00Z
                    data:
                    - id: 0193d000-0000-7000-8000-000000000102
                      displayName: Hotel Lake View
                      phoneLast4: '5678'
                      creditAllowed: true
                      creditLimit: '50000.00'
                serverTime: '2026-11-25T12:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /api/v1/sync/uploads:
    post:
      tags:
      - Sync
      operationId: upload
      summary: Upload what the till did offline (SYN-04..SYN-08)
      description: Records are processed in order, each in its own transaction; the response has one result per record.
        Every record id is also that record's idempotency key, so a batch resent under a new Idempotency-Key still processes
        each record once. A technical failure stops the batch with 500; the records before it are stored with their
        outcomes, and the till sends the whole batch again.
      x-permission: sync:upload
      x-error-codes:
      - VALIDATION_FAILED
      - DEVICE_REQUIRED
      - DEVICE_NOT_BOUND
      - BATCH_TOO_LARGE
      parameters:
      - name: Device-Time
        in: header
        required: false
        description: The till's clock when it sent the request (SYN-07).
        schema:
          type: string
          format: date-time
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            example:
              records:
              - type: BILL
                id: 0193f100-0000-7000-8000-000000000001
                payload:
                  id: 0193f100-0000-7000-8000-000000000001
                  number: R1-000042
                  channel: RETAIL
                  lines: []
                  tenders: []
                  totals: {}
                  completedAt: '2026-11-25T09:15:00Z'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                results:
                - type: BILL
                  id: 0193f100-0000-7000-8000-000000000001
                  status: ACCEPTED
                accepted: 1
                duplicates: 0
                rejected: 0
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
        '500':
          $ref: ./common.yaml#/components/responses/InternalError
  /api/v1/sync/status:
    get:
      tags:
      - Sync
      operationId: syncStatus
      summary: The calling till's sync status
      x-permission: sync:read
      x-error-codes:
      - DEVICE_REQUIRED
      - DEVICE_NOT_BOUND
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
              example:
                deviceId: 0193a6f1-0000-7000-8000-00000000d001
                registerId: 0193d100-0000-7000-8000-000000000001
                locationId: 0193b000-0000-7000-8000-000000000401
                lastUploadAt: '2026-11-25T12:00:00Z'
                clockSkewSeconds: 4
                flags: []
                missingNumbers: []
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common.yaml#/components/securitySchemes/bearerAuth
  schemas:
    Dataset:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          description: Opaque cursor; send it back to `GET /sync/changes`.
        data:
          description: The dataset; its shape is documented per dataset.
    RegisterInfo:
      type: object
      required:
      - id
      - code
      - billPrefix
      - lastNumber
      - locationId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        billPrefix:
          type: string
        lastNumber:
          type: integer
          format: int64
        locationId:
          type: string
          format: uuid
    SyncCustomer:
      type: object
      required:
      - id
      - displayName
      - creditAllowed
      - creditLimit
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        phoneLast4:
          type: string
          pattern: ^[0-9]{4}$
          description: Never the full number.
        customerGroupId:
          type: string
          format: uuid
        creditAllowed:
          type: boolean
        creditLimit:
          type: string
    SyncStockBalance:
      type: object
      required:
      - variantId
      - stockState
      - available
      properties:
        variantId:
          type: string
          format: uuid
        stockState:
          type: string
        available:
          $ref: '#/components/schemas/SignedQuantity'
    SyncDatasets:
      type: object
      properties:
        catalog:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: the catalog snapshot (catalog.yaml `CatalogSnapshot`).'
        priceLists:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: price list snapshots (pricing.yaml).'
        taxRates:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: tax categories with their rates.'
        settings:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: the sales and pricing settings a till needs.'
        receiptTemplate:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: the latest receipt template, as documents.yaml `ReceiptTemplate` describes it
            (DOC-06).'
        customers:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: `SyncCustomer[]`.'
        stockBalances:
          $ref: '#/components/schemas/Dataset'
          description: '`data`: `SyncStockBalance[]` of the register''s location.'
    BootstrapResponse:
      type: object
      required:
      - deviceId
      - register
      - datasets
      - serverTime
      properties:
        deviceId:
          type: string
          format: uuid
        register:
          $ref: '#/components/schemas/RegisterInfo'
        datasets:
          $ref: '#/components/schemas/SyncDatasets'
        serverTime:
          type: string
          format: date-time
    ChangesResponse:
      type: object
      required:
      - datasets
      - serverTime
      properties:
        datasets:
          $ref: '#/components/schemas/SyncDatasets'
          description: Only the datasets that changed since their cursor.
        serverTime:
          type: string
          format: date-time
    UploadRecordType:
      type: string
      enum:
      - SHIFT_OPEN
      - DRAWER_OPEN
      - BILL
      - VOID
      - RETURN
      - CASH_MOVEMENT
      - DRAWER_COUNT
      - SHIFT_CLOSE
      - WASTAGE
    UploadRecord:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - payload
      properties:
        type:
          $ref: '#/components/schemas/UploadRecordType'
        id:
          type: string
          format: uuid
          description: Generated on the till; the record's idempotency key (SYN-05).
        dependsOn:
          type: array
          description: Records of this batch or earlier ones it needs.
          maxItems: 20
          items:
            type: string
            format: uuid
        payload:
          type: object
          description: One of the `*Upload` schemas, by type.
    UploadRequest:
      type: object
      additionalProperties: false
      required:
      - records
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UploadRecord'
    UploadStatus:
      type: string
      enum:
      - ACCEPTED
      - DUPLICATE
      - REJECTED
    UploadResult:
      type: object
      required:
      - type
      - id
      - status
      properties:
        type:
          $ref: '#/components/schemas/UploadRecordType'
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadStatus'
        problem:
          $ref: ./common.yaml#/components/schemas/Problem
    UploadResponse:
      type: object
      required:
      - results
      - accepted
      - duplicates
      - rejected
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UploadResult'
        accepted:
          type: integer
        duplicates:
          type: integer
        rejected:
          type: integer
    SyncStatus:
      type: object
      required:
      - deviceId
      - registerId
      - flags
      properties:
        deviceId:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        lastBootstrapAt:
          type: string
          format: date-time
        lastUploadAt:
          type: string
          format: date-time
        clockSkewSeconds:
          type: integer
          format: int64
        flags:
          type: array
          items:
            type: string
            enum:
            - CLOCK_SKEW
        missingNumbers:
          type: array
          description: Bill numbers of the register not received yet.
          items:
            type: string
    BillUpload:
      type: object
      description: A completed bill as the till made it (sales.yaml `CreateBillRequest` fields).
      required:
      - id
      - number
      - channel
      - lines
      - tenders
      - totals
      - completedAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        shiftId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - RETAIL
          - WHOLESALE
        customerId:
          type: string
          format: uuid
        cashierId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required:
            - id
            - variantId
            - packagingUnitId
            - qty
            - unitPrice
            properties:
              id:
                type: string
                format: uuid
              variantId:
                type: string
                format: uuid
              packagingUnitId:
                type: string
                format: uuid
              qty:
                $ref: '#/components/schemas/Quantity'
              weighed:
                type: boolean
              unitPrice:
                $ref: '#/components/schemas/Amount'
              lineDiscount:
                $ref: '#/components/schemas/Amount'
              ruleDiscount:
                $ref: '#/components/schemas/Amount'
              discountApprovedBy:
                type: string
                format: uuid
        billDiscount:
          type: object
        tenders:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
        totals:
          type: object
        completedAt:
          type: string
          format: date-time
    VoidUpload:
      type: object
      required:
      - billId
      - reason
      - voidedAt
      properties:
        billId:
          type: string
          format: uuid
        reason:
          type: string
        approvedBy:
          type: string
          format: uuid
        voidedAt:
          type: string
          format: date-time
    ReturnUpload:
      type: object
      description: sales.yaml `ReturnRequest` fields; the record id is the credit note's id.
      required:
      - billId
      - reason
      - lines
      - returnedAt
      properties:
        billId:
          type: string
          format: uuid
        reason:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            type: object
        refundTenders:
          type: array
          items:
            type: object
        approvedBy:
          type: string
          format: uuid
        returnedAt:
          type: string
          format: date-time
    ShiftOpenUpload:
      type: object
      required:
      - openedAt
      properties:
        cashierId:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
    ShiftCloseUpload:
      type: object
      required:
      - shiftId
      - closedAt
      properties:
        shiftId:
          type: string
          format: uuid
        closedAt:
          type: string
          format: date-time
    DrawerOpenUpload:
      type: object
      required:
      - openingFloat
      - openedAt
      properties:
        openingFloat:
          $ref: '#/components/schemas/Amount'
        openedAt:
          type: string
          format: date-time
    CashMovementUpload:
      type: object
      required:
      - sessionId
      - type
      - amount
      - reason
      - occurredAt
      properties:
        sessionId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - PAID_OUT
          - PAID_IN
          - DROP
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
        occurredAt:
          type: string
          format: date-time
    DrawerCountUpload:
      type: object
      required:
      - sessionId
      - denominations
      - countedAt
      properties:
        sessionId:
          type: string
          format: uuid
        denominations:
          type: array
          minItems: 1
          items:
            type: object
        countedAt:
          type: string
          format: date-time
    WastageUpload:
      type: object
      description: inventory.yaml `AdjustmentRequest` fields at the register's location.
      required:
      - reason
      - lines
      - occurredAt
      properties:
        reason:
          type: string
        note:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            type: object
        occurredAt:
          type: string
          format: date-time
    Code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_\-]{0,29}$
    Status:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Quantity:
      type: string
      description: A positive decimal with up to 6 decimals.
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '10'
    SignedQuantity:
      type: string
      description: A decimal with up to 6 decimals; in > 0, out < 0 (INV-02).
      pattern: ^-?(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '-19565'
    UnitCost:
      type: string
      description: A non-negative cost per unit with up to 6 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,12})(\.[0-9]{1,6})?$
      example: '0.705341'
    Amount:
      type: string
      description: A non-negative money amount with up to 4 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      example: '13800.00'
