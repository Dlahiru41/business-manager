        bills:
          type: integer
          format: int32
        revenue:
          $ref: ./common.yaml#/components/schemas/Money
        discount:
          $ref: ./common.yaml#/components/schemas/Money
        tax:
          $ref: ./common.yaml#/components/schemas/Money
        cost:
          $ref: ./common.yaml#/components/schemas/Money
        margin:
          $ref: ./common.yaml#/components/schemas/Money
        marginPct:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,6})?$
          example: '30'
          description: margin / revenue × 100, 2 decimals; absent when revenue is 0.
    MarginTotals:
      type: object
      required:
      - revenue
      - discount
      - tax
      - cost
      - margin
      properties:
        revenue:
          $ref: ./common.yaml#/components/schemas/Money
        discount:
          $ref: ./common.yaml#/components/schemas/Money
        tax:
          $ref: ./common.yaml#/components/schemas/Money
        cost:
          $ref: ./common.yaml#/components/schemas/Money
        margin:
          $ref: ./common.yaml#/components/schemas/Money
        marginPct:
