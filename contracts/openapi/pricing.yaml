openapi: 3.1.0
info:
  title: BMP Pricing API
  version: 1.0.0
  description: |
    Price lists, prices, price rules, taxes and price resolution (phase 01, rules PRC-01..PRC-10).

    Every change of a list's prices takes the list's next version (PRC-03); bills record the version they were priced
    with. Resolution (PRC-04..PRC-07) looks for a price in the customer's lists, then the customer group's, then the
    channel's, then `ANY` lists, each by ascending `priority`; it derives unit prices from the base unit when the
    tenant allows it, applies price rules, and splits tax per line.

    Examples use the pilot shop's placeholder prices (LKR): an egg 55.00 retail / 48.00 wholesale, a 750 ml bottle of
    oil 620.00, an 18 kg can 14,500.00 wholesale; VAT 18 %.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: PriceLists
    description: Named, versioned sets of prices (PRC-01, PRC-03).
  - name: Prices
    description: Prices per variant, packaging unit, minimum quantity and validity (PRC-02), snapshots for tills (PRC-09).
  - name: PriceRules
    description: Quantity breaks, customer-group rules, promotions and markups (PRC-06).
  - name: PriceResolution
    description: The price of a basket for a channel, customer, quantity and moment (PRC-04..PRC-07, PRC-10).
  - name: Taxes
    description: Tax categories and their rates over time (PRC-07).

paths:
  /api/v1/price-lists:
    get:
      tags: [PriceLists]
      operationId: listPriceLists
      summary: Price lists, by priority then code
      x-permission: pricing:read
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListChannel"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of price lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListPage"
              example:
                items:
                  - id: 0193c000-0000-7000-8000-000000000901
                    code: RETAIL
                    name: Retail
                    channel: RETAIL
                    currency: LKR
                    taxInclusive: true
                    priority: 100
                    currentVersion: 3
                    status: ACTIVE
                    version: 3
                    createdAt: "2026-11-21T09:42:13Z"
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [PriceLists]
      operationId: createPriceList
      summary: Add a price list (PRC-01); Retail and Wholesale exist from the start
      x-permission: pricing:write
      x-error-codes: [VALIDATION_FAILED, PRICE_LIST_CODE_TAKEN, INVALID_PRICE_LIST_SCOPE, PRICE_CHANGE_RESTRICTED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceListRequest"
            example:
              code: HOTELS
              name: Hotels and restaurants
              channel: WHOLESALE
              customerGroupId: 0193d000-0000-7000-8000-000000000a01
              priority: 50
      responses:
        "201":
          description: Created, at version 0 without prices.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
              examples:
                default:
                  $ref: "#/components/examples/WholesaleList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/price-lists/{priceListId}:
    get:
      tags: [PriceLists]
      operationId: getPriceList
      summary: Get a price list
      x-permission: pricing:read
      x-error-codes: [PRICE_LIST_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
      responses:
        "200":
          description: The price list.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
              examples:
                default:
                  $ref: "#/components/examples/WholesaleList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [PriceLists]
      operationId: updatePriceList
      summary: Rename, re-prioritise or deactivate a price list
      x-permission: pricing:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, PRICE_LIST_NOT_FOUND, PRICE_CHANGE_RESTRICTED]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePriceListRequest"
            example:
              priority: 90
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
              examples:
                default:
                  $ref: "#/components/examples/WholesaleList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/price-lists/{priceListId}/prices:
    get:
      tags: [Prices]
      operationId: listPrices
      summary: The list's prices; the ETag is the list's price version
      x-permission: pricing:read
      x-error-codes: [PRICE_LIST_NOT_FOUND, INVALID_PARAMETER]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - name: variantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: unitId
          in: query
          required: false
          description: Packaging unit id.
          schema:
            type: string
            format: uuid
        - name: at
          in: query
          required: false
          description: Only prices valid at this moment (from inclusive, to exclusive).
          schema:
            type: string
            format: date-time
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of prices.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricePage"
              example:
                items:
                  - id: 0193c000-0000-7000-8000-000000000b01
                    priceListId: 0193c000-0000-7000-8000-000000000902
                    variantId: 0193b000-0000-7000-8000-000000000204
                    packagingUnitId: 0193b000-0000-7000-8000-000000000301
                    minQty: "1"
                    amount:
                      amount: "48.00"
                      currency: LKR
                    validFrom: "2026-11-21T09:42:13Z"
                    listVersion: 1
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      tags: [Prices]
      operationId: upsertPrices
      summary: Create or change up to 1,000 prices in one new list version (PRC-02, PRC-03, PRC-08)
      description: |
        All rows are validated first; then they are applied in one transaction as one new version, which publishes
        `PriceListChanged`. A row without `validFrom` is the price from now on: the open price of the same unit and
        minimum quantity ends now. A row with `validFrom` matching an existing price changes that price; any other
        overlap with an existing validity window of the same unit and minimum quantity is 409 `PRICE_OVERLAP`.
        Changes only affect the future: a row may not start before now, and a price that already applied keeps its
        amount and may only get a new end that is not before now; otherwise 409 `PRICE_IN_FORCE`.
        `If-Match` carries the list's price version (the ETag of `GET .../prices`).
      x-permission: pricing:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, PRICE_LIST_NOT_FOUND, PRICE_OVERLAP, PRICE_IN_FORCE, DUPLICATE_PRICE_ROWS, INVALID_VALIDITY, UNKNOWN_VARIANT, UNKNOWN_PACKAGING_UNIT, PRICE_CHANGE_RESTRICTED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPricesRequest"
            example:
              note: Wholesale egg prices (placeholders)
              prices:
                - variantId: 0193b000-0000-7000-8000-000000000204
                  packagingUnitId: 0193b000-0000-7000-8000-000000000301
                  amount: "48.00"
                - variantId: 0193b000-0000-7000-8000-000000000211
                  packagingUnitId: 0193b000-0000-7000-8000-000000000312
                  amount: "14500.00"
      responses:
        "200":
          description: The new version.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListVersion"
              examples:
                default:
                  $ref: "#/components/examples/PriceListVersion"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/price-lists/{priceListId}/versions:
    get:
      tags: [PriceLists]
      operationId: listPriceListVersions
      summary: The list's versions, newest first
      x-permission: pricing:read
      x-error-codes: [PRICE_LIST_NOT_FOUND, INVALID_PARAMETER]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of versions (without their changes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListVersionPage"
              example:
                items:
                  - priceListId: 0193c000-0000-7000-8000-000000000902
                    version: 1
                    publishedAt: "2026-11-21T09:42:13Z"
                    publishedBy: 0193a6f1-0000-7000-8000-00000000f001
                    note: Wholesale egg prices (placeholders)
                    changeCount: 2
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/v1/price-lists/{priceListId}/versions/{version}:
    get:
      tags: [PriceLists]
      operationId: getPriceListVersion
      summary: One version with its change summary
      x-permission: pricing:read
      x-error-codes: [PRICE_LIST_NOT_FOUND, PRICE_LIST_VERSION_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            example: 1
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListVersion"
              examples:
                default:
                  $ref: "#/components/examples/PriceListVersion"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/v1/price-lists/{priceListId}/snapshot:
    get:
      tags: [Prices]
      operationId: getPriceListSnapshot
      summary: All prices of the list at its current version, or those changed since a version (PRC-09)
      description: The ETag is the list's price version; an unchanged list answers 304 to If-None-Match.
      x-permission: pricing:read
      x-error-codes: [PRICE_LIST_NOT_FOUND, INVALID_PARAMETER]
      parameters:
        - $ref: "#/components/parameters/PriceListIdPath"
        - name: sinceVersion
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - $ref: "./common.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The snapshot or delta.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListSnapshot"
              example:
                priceListId: 0193c000-0000-7000-8000-000000000901
                code: RETAIL
                channel: RETAIL
                currency: LKR
                taxInclusive: true
                version: 3
                sinceVersion: 2
                full: false
                prices:
                  - id: 0193c000-0000-7000-8000-000000000b11
                    priceListId: 0193c000-0000-7000-8000-000000000901
                    variantId: 0193b000-0000-7000-8000-000000000211
                    packagingUnitId: 0193b000-0000-7000-8000-000000000314
                    minQty: "1"
                    amount:
                      amount: "620.00"
                      currency: LKR
                    validFrom: "2026-11-21T09:42:13Z"
                    listVersion: 3
        "304":
          $ref: "./common.yaml#/components/responses/NotModified"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/v1/price-rules:
    get:
      tags: [PriceRules]
      operationId: listPriceRules
      summary: Price rules, by priority then code
      x-permission: pricing:write
      x-error-codes: [INVALID_PARAMETER]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RuleKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRulePage"
              example:
                items:
                  - id: 0193c000-0000-7000-8000-000000000c01
                    code: EGG-300
                    name: Eggs, 300 pieces and more
                    kind: QTY_BREAK
                    conditions:
                      channel: WHOLESALE
                      productIds: [0193b000-0000-7000-8000-000000000101]
                      minQtyBase: "300"
                    effect:
                      type: PERCENT_OFF
                      value: "5"
                    priority: 10
                    stackable: false
                    status: ACTIVE
                    version: 0
                    createdAt: "2026-11-21T09:42:13Z"
                page:
                  limit: 50
                  hasMore: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      tags: [PriceRules]
      operationId: createPriceRule
      summary: Add a price rule (PRC-06)
      x-permission: pricing:write
      x-error-codes: [VALIDATION_FAILED, PRICE_RULE_CODE_TAKEN, INVALID_RULE_EFFECT, INVALID_VALIDITY, PRICE_CHANGE_RESTRICTED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceRuleRequest"
            example:
              code: EGG-300
              name: Eggs, 300 pieces and more
              kind: QTY_BREAK
              conditions:
                channel: WHOLESALE
                productIds: [0193b000-0000-7000-8000-000000000101]
                minQtyBase: "300"
              effect:
                type: PERCENT_OFF
                value: "5"
              priority: 10
      responses:
        "201":
          description: Created.
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRule"
              examples:
                default:
                  $ref: "#/components/examples/EggQtyBreak"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"

  /api/v1/price-rules/{ruleId}:
    get:
      tags: [PriceRules]
      operationId: getPriceRule
      summary: Get a price rule
      x-permission: pricing:write
      x-error-codes: [PRICE_RULE_NOT_FOUND]
      parameters:
        - $ref: "#/components/parameters/RuleIdPath"
      responses:
        "200":
          description: The rule.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRule"
              examples:
                default:
                  $ref: "#/components/examples/EggQtyBreak"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    patch:
      tags: [PriceRules]
      operationId: updatePriceRule
      summary: Change or deactivate a price rule
      x-permission: pricing:write
      x-error-codes: [VALIDATION_FAILED, PRECONDITION_REQUIRED, VERSION_CONFLICT, PRICE_RULE_NOT_FOUND, INVALID_RULE_EFFECT, INVALID_VALIDITY, PRICE_CHANGE_RESTRICTED]
      parameters:
        - $ref: "#/components/parameters/RuleIdPath"
        - $ref: "./common.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePriceRuleRequest"
            example:
              status: INACTIVE
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "./common.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRule"
              examples:
                default:
                  $ref: "#/components/examples/EggQtyBreak"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "412":
          $ref: "./common.yaml#/components/responses/PreconditionFailed"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableContent"
        "428":
          $ref: "./common.yaml#/components/responses/PreconditionRequired"

  /api/v1/prices:resolve:
    post:
      tags: [PriceResolution]
      operationId: resolvePrices
      summary: Price a basket (PRC-04..PRC-07, PRC-10)
      description: |
        Has no side effects; the Idempotency-Key is accepted like on every POST. A line without a price is
        `PRICE_NOT_FOUND` (PRC-05) — the basket is still answered. Amounts are rounded per line; totals are sums of
        rounded lines.
      x-permission: pricing:read
      x-error-codes: [VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED]
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePricesRequest"
            example:
              channel: RETAIL
              at: "2026-11-21T10:00:00Z"
              lines:
                - lineId: "1"
                  variantId: 0193b000-0000-7000-8000-000000000204
                  packagingUnitId: 0193b000-0000-7000-8000-000000000301
                  qty: "10"
                - lineId: "2"
                  variantId: 0193b000-0000-7000-8000-000000000211
                  packagingUnitId: 0193b000-0000-7000-8000-000000000314
                  qty: "1"
      responses:
        "200":
          description: The priced basket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedPrices"
              example:
                channel: RETAIL
                currency: LKR
                at: "2026-11-21T10:00:00Z"
                lines:
                  - lineId: "1"
                    variantId: 0193b000-0000-7000-8000-000000000204
                    packagingUnitId: 0193b000-0000-7000-8000-000000000301
                    qty: "10"
                    status: PRICED
                    unitPrice:
                      amount: "55.00"
                      currency: LKR
                    amount:
                      amount: "550.00"
                      currency: LKR
                    discount:
                      amount: "0.00"
                      currency: LKR
                    netAmount:
                      amount: "466.10"
                      currency: LKR
                    taxAmount:
                      amount: "83.90"
                      currency: LKR
                    lineTotal:
                      amount: "550.00"
                      currency: LKR
                    taxInclusive: true
                    priceListId: 0193c000-0000-7000-8000-000000000901
                    priceListVersion: 3
                    source: LIST
                    appliedRules: []
                    taxes:
                      - taxRateId: 0193c000-0000-7000-8000-000000000811
                        code: VAT
                        ratePct: "18"
                        amount:
                          amount: "83.90"
                          currency: LKR
                  - lineId: "2"
                    variantId: 0193b000-0000-7000-8000-000000000211
                    packagingUnitId: 0193b000-0000-7000-8000-000000000314
