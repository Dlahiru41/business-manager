components:
  securitySchemes:
    bearerAuth:
      $ref: "./common.yaml#/components/securitySchemes/bearerAuth"

  parameters:
    PriceListIdPath:
      name: priceListId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaxCategoryIdPath:
      name: taxCategoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaxRateIdPath:
      name: taxRateId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Status:
      type: string
      enum: [ACTIVE, INACTIVE]
    ListChannel:
      type: string
      enum: [RETAIL, WHOLESALE, ANY]
    SalesChannel:
      type: string
      enum: [RETAIL, WHOLESALE]
    RuleKind:
      type: string
      enum: [QTY_BREAK, CUSTOMER_GROUP, PROMOTION, MARKUP]
    EffectType:
      type: string
      enum: [PERCENT_OFF, AMOUNT_OFF, FIXED_PRICE, MARKUP_PERCENT]
    Amount:
      type: string
      description: A non-negative money amount with up to 4 decimals, in the tenant currency.
      pattern: '^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$'
      example: "620.00"
    Quantity:
      type: string
      description: A positive decimal with up to 6 decimals.
      pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$'
      example: "10"
    Rate:
      type: string
      description: A percentage with up to 4 decimals.
      pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,4})?$'
      example: "18"
    Code:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_\-]{0,29}$'

    PriceList:
      type: object
      required: [id, code, name, channel, currency, taxInclusive, priority, currentVersion, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        channel:
          $ref: "#/components/schemas/ListChannel"
        customerGroupId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        taxInclusive:
          type: boolean
          description: Prices include tax (tax is back-calculated); fixed at creation.
        priority:
          type: integer
          format: int32
          description: Lower values are tried first within the same scope (PRC-04).
        currentVersion:
          type: integer
          format: int32
          description: The price version; bills record it (PRC-03, PRC-10).
        status:
          $ref: "#/components/schemas/Status"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    PriceListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceList"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreatePriceListRequest:
      type: object
      additionalProperties: false
      required: [code, name, channel]
      description: At most one of `customerGroupId` and `customerId`.
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 80
        channel:
          $ref: "#/components/schemas/ListChannel"
        customerGroupId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        taxInclusive:
          type: boolean
          description: Defaults to the tenant setting `pricing.pricesTaxInclusive`.
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
          default: 100
    UpdatePriceListRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        status:
          $ref: "#/components/schemas/Status"

    Price:
      type: object
      required: [id, priceListId, variantId, packagingUnitId, minQty, amount, validFrom, listVersion]
      properties:
        id:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        minQty:
          type: string
          description: In the packaging unit; the highest one not above the quantity applies (PRC-04).
        amount:
          $ref: "./common.yaml#/components/schemas/Money"
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          description: Exclusive; absent while open-ended.
        listVersion:
          type: integer
          format: int32
          description: The list version that last changed this price.
    PricePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Price"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    PriceInput:
      type: object
      description: >-
        One price row. `minQty` (in the packaging unit, default 1, greater than 0) is the quantity the price applies
        from; a weighed unit sold in fractions (0.75 kg) needs a smaller minimum such as 0.001. Without `validFrom`
        the price starts now and ends the open price of the same key; `validFrom` may not be in the past.
      additionalProperties: false
      required: [variantId, packagingUnitId, amount]
      properties:
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        minQty:
          $ref: "#/components/schemas/Quantity"
        amount:
          $ref: "#/components/schemas/Amount"
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    UpsertPricesRequest:
      type: object
      additionalProperties: false
      required: [prices]
      properties:
        note:
          type: string
          maxLength: 200
        prices:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PriceInput"
    PriceChange:
      type: object
      required: [change, priceId, variantId, packagingUnitId, minQty, validFrom, amount]
      properties:
        change:
          type: string
          enum: [CREATED, UPDATED, ENDED]
        priceId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        minQty:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        amount:
          type: string
        previousAmount:
          type: string
        previousValidTo:
          type: string
          format: date-time
    PriceListVersion:
      type: object
      required: [priceListId, version, publishedAt, changeCount]
      properties:
        priceListId:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          format: uuid
        note:
          type: string
        changeCount:
          type: integer
          format: int32
        changes:
          type: array
          description: Only when reading one version or after an upsert.
          items:
            $ref: "#/components/schemas/PriceChange"
    PriceListVersionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceListVersion"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    PriceListSnapshot:
      type: object
      required: [priceListId, code, channel, currency, taxInclusive, version, full, prices]
      properties:
        priceListId:
          type: string
          format: uuid
        code:
          type: string
        channel:
          $ref: "#/components/schemas/ListChannel"
        customerGroupId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        currency:
          type: string
        taxInclusive:
          type: boolean
        version:
          type: integer
          format: int32
        sinceVersion:
          type: integer
          format: int32
        full:
          type: boolean
        prices:
          type: array
          description: Full snapshots hold every price not yet ended; deltas every price changed after `sinceVersion`.
          items:
            $ref: "#/components/schemas/Price"

    RuleConditions:
      type: object
      additionalProperties: false
      description: All given conditions must hold; an absent condition matches everything.
      properties:
        channel:
          $ref: "#/components/schemas/SalesChannel"
        priceListIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        customerGroupIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        customerIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        productIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        variantIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        packagingUnitIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        minQtyBase:
          description: Minimum line quantity in the variant's base unit (e.g. 300 pieces = 10 trays).
          $ref: "#/components/schemas/Quantity"
    RuleEffect:
      type: object
      additionalProperties: false
      required: [type, value]
      description: "`value` is a percentage for PERCENT_OFF / MARKUP_PERCENT, an amount per sold unit otherwise."
      properties:
        type:
          $ref: "#/components/schemas/EffectType"
        value:
          $ref: "#/components/schemas/Amount"
    PriceRule:
      type: object
      required: [id, code, name, kind, conditions, effect, priority, stackable, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/RuleKind"
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        priority:
          type: integer
          format: int32
        stackable:
          type: boolean
          description: A promotion that may apply on top of another promotion (PRC-06).
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Status"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    PriceRulePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceRule"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreatePriceRuleRequest:
      type: object
      additionalProperties: false
      required: [code, name, kind, effect]
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: "#/components/schemas/RuleKind"
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
          default: 100
        stackable:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    UpdatePriceRuleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        stackable:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Status"

    ResolveLine:
      type: object
      additionalProperties: false
      required: [variantId, packagingUnitId, qty]
      properties:
        lineId:
          type: string
          description: The caller's line reference, echoed back.
          maxLength: 40
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Quantity"
    ResolvePricesRequest:
      type: object
      additionalProperties: false
      required: [channel, lines]
      properties:
        channel:
          $ref: "#/components/schemas/SalesChannel"
        customerId:
          type: string
          format: uuid
        customerGroupId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
          description: Defaults to now.
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ResolveLine"
    LineTax:
      type: object
      required: [taxRateId, code, ratePct, amount]
      properties:
        taxRateId:
          type: string
          format: uuid
        code:
          type: string
        ratePct:
          type: string
        amount:
          $ref: "./common.yaml#/components/schemas/Money"
    ResolvedLine:
      type: object
      description: |
        `unitPrice` is the list (or derived) price of one unit before rules; `amount` is quantity × price after rules,
        rounded, tax included when `taxInclusive`; `discount` is quantity × list price, rounded, minus `amount`
        (negative for markups); `lineTotal` is what the customer pays (net + tax).
      required: [variantId, packagingUnitId, qty, status, appliedRules, taxes]
      properties:
        lineId:
          type: string
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          type: string
        status:
          type: string
          enum: [PRICED, PRICE_NOT_FOUND, NOT_SELLABLE]
          description: "`NOT_SELLABLE`: unknown or inactive variant, or a unit that is not sold."
        unitPrice:
          $ref: "./common.yaml#/components/schemas/Money"
        amount:
          $ref: "./common.yaml#/components/schemas/Money"
        discount:
          $ref: "./common.yaml#/components/schemas/Money"
        netAmount:
          $ref: "./common.yaml#/components/schemas/Money"
        taxAmount:
          $ref: "./common.yaml#/components/schemas/Money"
        lineTotal:
          $ref: "./common.yaml#/components/schemas/Money"
        taxInclusive:
          type: boolean
        priceListId:
          type: string
          format: uuid
        priceListVersion:
          type: integer
          format: int32
        source:
          type: string
          description: "`LIST`, `DERIVED` or `RULE:<code>` of the last rule that changed the price (PRC-10)."
          example: LIST
        appliedRules:
          type: array
          items:
            type: string
        taxes:
          type: array
          items:
            $ref: "#/components/schemas/LineTax"
    Totals:
      type: object
      description: Sums of the priced lines.
      required: [netAmount, taxAmount, discount, lineTotal]
      properties:
        netAmount:
          $ref: "./common.yaml#/components/schemas/Money"
        taxAmount:
          $ref: "./common.yaml#/components/schemas/Money"
        discount:
          $ref: "./common.yaml#/components/schemas/Money"
        lineTotal:
          $ref: "./common.yaml#/components/schemas/Money"
    ResolvedPrices:
      type: object
      required: [channel, currency, at, lines, totals]
      properties:
        channel:
          $ref: "#/components/schemas/SalesChannel"
        currency:
          type: string
        at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedLine"
        totals:
          $ref: "#/components/schemas/Totals"

    TaxCategory:
      type: object
      required: [id, code, name, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    TaxCategoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaxCategory"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreateTaxCategoryRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 80
    UpdateTaxCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: "#/components/schemas/Status"
    TaxRate:
      type: object
      required: [id, taxCategoryId, code, name, ratePct, compound, validFrom, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taxCategoryId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        ratePct:
          type: string
        compound:
          type: boolean
          description: Charged on the amount including the non-compound taxes.
        validFrom:
          type: string
          format: date
          description: First business date the rate applies (inclusive).
        validTo:
          type: string
          format: date
          description: First business date it no longer applies (exclusive).
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    TaxRatePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaxRate"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    CreateTaxRateRequest:
      type: object
      additionalProperties: false
      required: [taxCategoryId, code, name, ratePct, validFrom]
      properties:
        taxCategoryId:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 80
        ratePct:
          $ref: "#/components/schemas/Rate"
        compound:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    UpdateTaxRateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        validTo:
          type: string
          format: date

