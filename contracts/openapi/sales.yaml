components:
  securitySchemes:
    bearerAuth:
      $ref: ./common.yaml#/components/securitySchemes/bearerAuth
  schemas:
    SalesChannel:
      type: string
      enum:
      - RETAIL
      - WHOLESALE
    RegisterStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Register:
      type: object
      required:
      - id
      - code
      - locationId
      - billPrefix
      - status
      - lastNumber
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        locationId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        billPrefix:
          type: string
          example: R1
        status:
          $ref: '#/components/schemas/RegisterStatus'
        lastNumber:
          type: integer
          format: int64
          minimum: 0
          description: Highest bill sequence accepted from the register; the till continues after it.
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    RegisterPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Register'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    CreateRegisterRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - locationId
      - billPrefix
      properties:
        code:
          $ref: '#/components/schemas/Code'
        name:
          type: string
          minLength: 1
          maxLength: 80
        locationId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        billPrefix:
          type: string
          pattern: ^[A-Z0-9]{1,8}$
    UpdateRegisterRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        deviceId:
          type: string
          format: uuid
        billPrefix:
          type: string
          pattern: ^[A-Z0-9]{1,8}$
        status:
          $ref: '#/components/schemas/RegisterStatus'
    ShiftStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
    Shift:
      type: object
      required:
      - id
      - registerId
      - status
      - openedAt
      - offline
      - version
      properties:
        id:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
        cashierId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShiftStatus'
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        offline:
          type: boolean
          description: Created for offline bills without a known shift.
        version:
          type: integer
          format: int64
    OpenShiftRequest:
      type: object
      additionalProperties: false
      required:
      - registerId
      properties:
        id:
          type: string
          format: uuid
          description: Generated on the till; the server generates one when absent.
        registerId:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
    CloseShiftRequest:
      type: object
      additionalProperties: false
      properties:
        closedAt:
          type: string
          format: date-time
    BillStatus:
      type: string
      enum:
      - DRAFT
      - COMPLETED
      - VOIDED
      - PARTIALLY_RETURNED
      - RETURNED
    BillFlag:
      type: string
      description: Why an offline bill was accepted although it breaks an online rule.
      enum:
      - PRICE_MISMATCH
      - TOTALS_MISMATCH
      - DISCOUNT_LIMIT_EXCEEDED
      - CREDIT_LIMIT_EXCEEDED
      - LATE_SYNC
      - OFFLINE_SHIFT
      - TENDER_MISMATCH
    TenderMethod:
      type: string
      enum:
      - CASH
      - CARD
      - BANK_TRANSFER
      - MOBILE_WALLET
      - CHEQUE
      - CREDIT
    Tender:
      type: object
      required:
      - id
      - method
      - amount
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/TenderMethod'
        amount:
          $ref: ./common.yaml#/components/schemas/Money
        tendered:
          $ref: ./common.yaml#/components/schemas/Money
        change:
          $ref: ./common.yaml#/components/schemas/Money
        reference:
          type: string
          description: Card slip, transfer or cheque reference; never a card number.
    TenderInput:
      type: object
      additionalProperties: false
      required:
      - id
      - method
      - amount
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/TenderMethod'
        amount:
          $ref: '#/components/schemas/Amount'
        tendered:
          $ref: '#/components/schemas/Amount'
          description: Cash handed over; at least the amount (SAL-06).
        reference:
          type: string
          minLength: 1
          maxLength: 60
          description: Required for CARD and BANK_TRANSFER unless the tenant relaxes it.
    DiscountType:
      type: string
      enum:
      - AMOUNT
      - PERCENT
    BillDiscount:
      type: object
      required:
      - type
      - value
      properties:
        type:
          $ref: '#/components/schemas/DiscountType'
        value:
          type: string
          description: An amount or a percentage.
        reason:
          type: string
        approvedBy:
          type: string
          format: uuid
    BillDiscountInput:
      type: object
      additionalProperties: false
      required:
      - type
      - value
      properties:
        type:
          $ref: '#/components/schemas/DiscountType'
        value:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          minLength: 1
          maxLength: 200
        approvedBy:
          type: string
          format: uuid
          description: A user with `sales:discount-unlimited` above `maxCashierDiscountPct`.
    PriceOverride:
      type: object
      additionalProperties: false
      required:
      - unitPrice
      - approvedBy
      properties:
        unitPrice:
          $ref: '#/components/schemas/Amount'
        approvedBy:
          type: string
          format: uuid
          description: A user with `sales:price-override`.
        reason:
          type: string
          minLength: 1
          maxLength: 200
    BillLineInput:
      type: object
      additionalProperties: false
      required:
      - id
      - variantId
      - packagingUnitId
      - qty
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
          description: In the packaging unit; weighed kilograms with up to 3 decimals (SAL-15).
        weighed:
          type: boolean
        unitPrice:
          $ref: '#/components/schemas/Amount'
          description: The price the till shows; checked against pricing (SAL-03).
        lineDiscount:
          $ref: '#/components/schemas/Amount'
          description: The cashier's discount on the line.
        ruleDiscount:
          $ref: '#/components/schemas/Amount'
          description: What price rules took off, as the till computed it.
        discountApprovedBy:
          type: string
          format: uuid
        priceOverride:
          $ref: '#/components/schemas/PriceOverride'
    BillLine:
      type: object
      required:
      - id
      - variantId
      - packagingUnitId
      - description
      - qty
      - qtyBase
      - stockState
      - weighed
      - unitPrice
      - lineDiscount
      - allocatedBillDiscount
      - taxAmount
      - lineTotal
      - returnedQty
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        packagingUnitId:
          type: string
          format: uuid
        description:
          type: string
        qty:
          $ref: '#/components/schemas/Quantity'
        qtyBase:
          $ref: '#/components/schemas/Quantity'
        stockState:
          type: string
        weighed:
          type: boolean
        unitPrice:
          $ref: ./common.yaml#/components/schemas/Money
        lineDiscount:
          $ref: ./common.yaml#/components/schemas/Money
        ruleDiscount:
          $ref: ./common.yaml#/components/schemas/Money
        allocatedBillDiscount:
          $ref: ./common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ./common.yaml#/components/schemas/Money
        lineTotal:
          $ref: ./common.yaml#/components/schemas/Money
        priceSource:
          type: string
        returnedQty:
          $ref: '#/components/schemas/Quantity'
    BillTotals:
      type: object
      description: subtotal = Σ round(qty × unit price); discountTotal = line and bill discounts; grandTotal = Σ line totals,
        what the customer pays.
      required:
      - subtotal
      - discountTotal
      - taxTotal
      - grandTotal
      properties:
        subtotal:
          $ref: ./common.yaml#/components/schemas/Money
        discountTotal:
          $ref: ./common.yaml#/components/schemas/Money
        taxTotal:
          $ref: ./common.yaml#/components/schemas/Money
        grandTotal:
          $ref: ./common.yaml#/components/schemas/Money
    TotalsInput:
      type: object
      description: The totals the till computed (SAL-04).
      additionalProperties: false
      required:
      - subtotal
      - discountTotal
      - taxTotal
      - grandTotal
      properties:
        subtotal:
          $ref: '#/components/schemas/Amount'
        discountTotal:
          $ref: '#/components/schemas/Amount'
        taxTotal:
          $ref: '#/components/schemas/Amount'
        grandTotal:
          $ref: '#/components/schemas/Amount'
    Bill:
      type: object
      required:
      - id
      - number
      - registerId
      - locationId
      - channel
      - status
      - lines
      - totals
      - tenders
      - offline
      - flags
      - currency
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: R1-000042
        registerId:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/SalesChannel'
        customerId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        priceListVersion:
          type: integer
        status:
          $ref: '#/components/schemas/BillStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLine'
        billDiscount:
          $ref: '#/components/schemas/BillDiscount'
        totals:
          $ref: '#/components/schemas/BillTotals'
        deviceTotals:
          $ref: '#/components/schemas/BillTotals'
          description: Only on an offline bill whose till totals differ from the server's recomputation (SAL-04). The customer
            paid these; tenders add up to their grand total and SaleCompleted carries them.
        tenders:
          type: array
          items:
            $ref: '#/components/schemas/Tender'
        businessDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
        cashierId:
          type: string
          format: uuid
        offline:
          type: boolean
        flags:
          type: array
          items:
            $ref: '#/components/schemas/BillFlag'
        currency:
          type: string
        voidReason:
          type: string
        voidedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    BillPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    CreateBillRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - registerId
      - channel
      - lines
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 generated on the till (SAL-01).
        number:
          type: string
          pattern: ^[A-Z0-9]{1,8}-[0-9]{6}$
        registerId:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/SalesChannel'
        customerId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BillLineInput'
        billDiscount:
          $ref: '#/components/schemas/BillDiscountInput'
        complete:
          type: boolean
          description: Submit an already completed bill (SAL-02); then `tenders` and `totals` are required.
        tenders:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/TenderInput'
        totals:
          $ref: '#/components/schemas/TotalsInput'
        priceListVersion:
          type: integer
          minimum: 1
        completedAt:
          type: string
          format: date-time
        creditApprovedBy:
          type: string
          format: uuid
          description: A user with `sales:credit-override` above the credit limit.
    UpdateBillRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        channel:
          $ref: '#/components/schemas/SalesChannel'
        customerId:
          type: string
          format: uuid
        lines:
          type: array
          description: Replaces all lines.
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BillLineInput'
        billDiscount:
          $ref: '#/components/schemas/BillDiscountInput'
    CompleteBillRequest:
      type: object
      additionalProperties: false
      required:
      - tenders
      - totals
      properties:
        tenders:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/TenderInput'
        totals:
          $ref: '#/components/schemas/TotalsInput'
        completedAt:
          type: string
          format: date-time
        creditApprovedBy:
          type: string
          format: uuid
          description: A user with `sales:credit-override` above the credit limit.
    VoidBillRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
        approvedBy:
          type: string
          format: uuid
          description: A manager when `voidRequiresManager` (SAL-09).
        registerId:
          type: string
          format: uuid
          description: The register the money is given back at, of the bill's location (`BILL_OF_ANOTHER_LOCATION`
            otherwise); defaults to the bill's own register.
    ReturnLineInput:
      type: object
      additionalProperties: false
      required:
      - billLineId
      - qty
      - restock
      properties:
        billLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        restock:
          type: boolean
    RefundTenderInput:
      type: object
      additionalProperties: false
      required:
      - method
      - amount
      properties:
        method:
          type: string
          enum:
          - CASH
          - CARD
          - BANK_TRANSFER
          - MOBILE_WALLET
          - CHEQUE
          - CREDIT
        amount:
          $ref: '#/components/schemas/Amount'
        reference:
          type: string
          minLength: 1
          maxLength: 60
    ReturnRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - reason
      - lines
      properties:
        id:
          type: string
          format: uuid
          description: The credit note's id, generated by the caller.
        reason:
          type: string
          minLength: 1
          maxLength: 200
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReturnLineInput'
        refundTenders:
          type: array
          description: Defaults to the original methods (cash when the bill had several).
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RefundTenderInput'
        approvedBy:
          type: string
          format: uuid
          description: A user with `sales:return-override` after `returnWindowDays`.
        registerId:
          type: string
          format: uuid
          description: The register the money is given back at, of the bill's location (`BILL_OF_ANOTHER_LOCATION`
            otherwise); defaults to the bill's own register.
    CreditNoteLine:
      type: object
      required:
      - billLineId
      - variantId
      - qty
      - qtyBase
      - amount
      - taxAmount
      - restock
      properties:
        billLineId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        qtyBase:
          $ref: '#/components/schemas/Quantity'
        amount:
          $ref: ./common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ./common.yaml#/components/schemas/Money
        restock:
          type: boolean
    RefundTender:
      type: object
      required:
      - method
      - amount
      properties:
        method:
          type: string
        amount:
          $ref: ./common.yaml#/components/schemas/Money
        reference:
          type: string
    CreditNote:
      type: object
      required:
      - id
      - number
      - billId
      - reason
      - total
      - lines
      - refundTenders
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: CN-000001
        billId:
          type: string
          format: uuid
        reason:
          type: string
        total:
          $ref: ./common.yaml#/components/schemas/Money
        taxTotal:
          $ref: ./common.yaml#/components/schemas/Money
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteLine'
        refundTenders:
          type: array
          items:
            $ref: '#/components/schemas/RefundTender'
        approvedBy:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreditNotePage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditNote'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
    Code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_\-]{0,29}$
    Status:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Quantity:
      type: string
      description: A positive decimal with up to 6 decimals.
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '10'
    SignedQuantity:
      type: string
      description: A decimal with up to 6 decimals; in > 0, out < 0 (INV-02).
      pattern: ^-?(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '-19565'
    UnitCost:
      type: string
      description: A non-negative cost per unit with up to 6 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,12})(\.[0-9]{1,6})?$
      example: '0.705341'
    Amount:
      type: string
      description: A non-negative money amount with up to 4 decimals, in the tenant currency.
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      example: '13800.00'
