      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPage'
              example:
                items:
                - id: 0193d100-0000-7000-8000-000000000001
                  code: R1
                  name: Front counter
                  locationId: 0193b000-0000-7000-8000-000000000401
                  billPrefix: R1
                  status: ACTIVE
                  lastNumber: 41
                  version: 0
                  createdAt: '2026-11-25T08:00:00Z'
                page:
                  limit: 50
                  hasMore: false
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
    post:
      tags:
      - Registers
      operationId: createRegister
      summary: Create a register
      x-permission: sales:admin
      x-error-codes:
      - VALIDATION_FAILED
      - REGISTER_CODE_TAKEN
      - BILL_PREFIX_TAKEN
      - UNKNOWN_LOCATION
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
            example:
              code: R1
              name: Front counter
              locationId: 0193b000-0000-7000-8000-000000000401
              billPrefix: R1
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ./common.yaml#/components/headers/Location
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
              example:
                id: 0193d100-0000-7000-8000-000000000001
                code: R1
                name: Front counter
                locationId: 0193b000-0000-7000-8000-000000000401
                billPrefix: R1
                status: ACTIVE
                lastNumber: 41
                version: 0
                createdAt: '2026-11-25T08:00:00Z'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/UnprocessableContent
