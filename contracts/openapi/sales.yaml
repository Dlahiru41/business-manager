openapi: 3.1.0
info:
  title: BMP Sales API
  version: 1.0.0
  description: 'Registers, shifts, bills, voids, returns and credit notes (phase 03, rules SAL-01..SAL-15).


    A bill''s id is a UUIDv7 generated on the till and its number `<registerPrefix>-<6-digit sequence>` is allocated on
    the

    till per register (SAL-01): resubmitting the same id replays, the same number with another id is

    `BILL_NUMBER_CONFLICT`. Bills enter as a draft that is edited and completed, or as an already completed bill (SAL-02);

    this API is the online path, where prices are re-resolved through pricing (SAL-03) and totals recomputed (SAL-04) and

    any difference is refused. Offline bills arrive through `POST /sync/uploads` and are accepted with flags instead.

    Completed bills never change (SAL-08); a void (same business date, SAL-09) or a return with a credit note (SAL-10)

    corrects them. Sales stores no cost: cost per line is on inventory''s `StockIssued` (SAL-11).

    '
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Registers
  description: Billing counters and their bill number prefixes (SAL-01, SAL-12).
- name: Shifts
  description: A cashier's shift on a register (SAL-12).
- name: Bills
  description: 'Sale documents: draft, complete, void, return (SAL-01..SAL-15).'
- name: CreditNotes
  description: Return documents (SAL-10).
paths:
  /api/v1/registers:
    get:
      tags:
      - Registers
      operationId: listRegisters
      summary: Registers, by code
      x-permission: sales:admin
      x-error-codes:
