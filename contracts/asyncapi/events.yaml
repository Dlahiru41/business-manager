      TransformationDefinitionPublished:
        $ref: "#/components/messages/TransformationDefinitionPublished"
      TransformationDefinitionRetired:
        $ref: "#/components/messages/TransformationDefinitionRetired"
  pricingPriceList:
    address: bmp.pricing.price-list
    messages:
      PriceListChanged:
        $ref: "#/components/messages/PriceListChanged"

  partyParty:
    address: bmp.party.party
    messages:
      PartyCreated:
        $ref: '#/components/messages/PartyCreated'
      PartyUpdated:
        $ref: '#/components/messages/PartyUpdated'
  procurementGoodsReceipt:
    address: bmp.procurement.goods-receipt
