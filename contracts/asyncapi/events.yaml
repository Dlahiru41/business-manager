  salesBill:
    address: bmp.sales.bill
    messages:
      SaleCompleted:
        $ref: '#/components/messages/SaleCompleted'
      SaleReturned:
        $ref: '#/components/messages/SaleReturned'
      SaleVoided:
        $ref: '#/components/messages/SaleVoided'
  paymentsPayment:
    address: bmp.payments.payment
    messages:
      PaymentCaptured:
        $ref: '#/components/messages/PaymentCaptured'
      PaymentRefunded:
        $ref: '#/components/messages/PaymentRefunded'
  paymentsDrawer:
    address: bmp.payments.drawer-session
    messages:
      DrawerReconciled:
        $ref: '#/components/messages/DrawerReconciled'
  syncRegister:
    address: bmp.sync.register
    messages:
      BillNumberGapDetected:
        $ref: '#/components/messages/BillNumberGapDetected'
  financeJournal:
    address: bmp.finance.journal
