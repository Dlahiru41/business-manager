      ExpenseRecorded:
        $ref: '#/components/messages/ExpenseRecorded'
  financeReceivable:
    address: bmp.finance.receivable
    messages:
      ReceivableOverdue:
        $ref: '#/components/messages/ReceivableOverdue'
  financePeriod:
    address: bmp.finance.period
