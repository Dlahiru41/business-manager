asyncapi: 3.0.0
info:
  title: BMP domain events
  version: 1.0.0
  description: |
    Events published by the platform modules (docs/reference/event-catalogue.md, 07-events-and-messaging.md).
    Phases 00-05 deliver them in-process through the Spring Modulith event publication registry (outbox); phase 06
    externalizes them to Kafka. Type names: `bmp.<module>.<event-kebab>.v<N>`; topics `bmp.<module>.<aggregate>`,
    key = aggregate id. Payloads carry ids, never personal data. Consumers must ignore unknown fields; producers add
    fields only (a breaking change is a new version).

channels:
  tenantTenant:
    address: bmp.tenant.tenant
    messages:
      TenantCreated:
        $ref: "#/components/messages/TenantCreated"
      SettingsChanged:
        $ref: "#/components/messages/SettingsChanged"
  tenantLocation:
    address: bmp.tenant.location
    messages:
      LocationCreated:
        $ref: "#/components/messages/LocationCreated"
  iamDevice:
    address: bmp.iam.device
    messages:
      DeviceRegistered:
        $ref: "#/components/messages/DeviceRegistered"

  catalogProduct:
    address: bmp.catalog.product
    messages:
      ProductCreated:
        $ref: "#/components/messages/ProductCreated"
      ProductUpdated:
        $ref: "#/components/messages/ProductUpdated"
  catalogVariant:
    address: bmp.catalog.variant
    messages:
      VariantCreated:
        $ref: "#/components/messages/VariantCreated"
      VariantUpdated:
        $ref: "#/components/messages/VariantUpdated"
      VariantDeactivated:
        $ref: "#/components/messages/VariantDeactivated"
  catalogTransformationDefinition:
