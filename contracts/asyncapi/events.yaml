      StockReceived:
        $ref: '#/components/messages/StockReceived'
      StockAdjusted:
        $ref: '#/components/messages/StockAdjusted'
      StockLevelLow:
        $ref: '#/components/messages/StockLevelLow'
  inventoryTransformation:
