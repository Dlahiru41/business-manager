  schemas:
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    EventMetadata:
      type: object
      additionalProperties: false
      description: Actor, request and trace of the publisher (ids only).
      properties:
        actorId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          $ref: "#/components/schemas/Uuid"
        requestId:
          type: string
        traceparent:
          type: string
    TenantCreated:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, occurredAt, aggregateId, aggregateVersion, metadata, businessType, currency,
                 timeZone, businessDayCutoffHour]
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
        tenantId:
          $ref: "#/components/schemas/Uuid"
        occurredAt:
          type: string
          format: date-time
        aggregateId:
          $ref: "#/components/schemas/Uuid"
        aggregateVersion:
          type: integer
          minimum: 0
        metadata:
          $ref: "#/components/schemas/EventMetadata"
        businessType:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timeZone:
          type: string
        businessDayCutoffHour:
          type: integer
          minimum: 0
          maximum: 23
        templatePackId:
          type: string
    SettingsChanged:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, occurredAt, aggregateId, aggregateVersion, metadata, group, changes]
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
        tenantId:
          $ref: "#/components/schemas/Uuid"
        occurredAt:
          type: string
          format: date-time
        aggregateId:
          $ref: "#/components/schemas/Uuid"
        aggregateVersion:
